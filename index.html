<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Council 我的 AI 智囊團</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#111;background:#eef2f7;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:10px 14px;display:flex;align-items:baseline;gap:8px;min-height:48px}
header h1{font-size:18px;margin:0}
header small{color:#e5e7eb;font-size:13px}
main{max-width:920px;margin:0 auto;padding:10px}
.card{background:#fff;border:1.5px solid #cbd5e1;border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:17px}
.lbl{font-weight:700;margin:10px 0 4px;font-size:15px}
textarea,input,select{width:100%;font:inherit;color:#111;border:1.5px solid #475569;border-radius:8px;padding:8px;background:#fff}
textarea{resize:vertical}
button,.btn{font:inherit;font-size:15px;font-weight:700;min-height:40px;padding:6px 12px;border-radius:8px;border:1.5px solid #111827;background:#fff;color:#111827;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
button:disabled{opacity:.45}
.primary{background:#111827;color:#fff}
.danger{border-color:#b91c1c;color:#b91c1c}
.big{width:100%;font-size:17px;min-height:48px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.on{background:#111827;color:#fff}
.hint{color:#1f2937;font-size:14px;margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1.5px solid #111827;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{border:0;border-radius:0;min-height:56px;font-size:16px}
nav button.on{background:#111827;color:#fff}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
details.step{background:#fff;border:1.5px solid #cbd5e1;border-left:6px solid var(--c,#475569);border-radius:10px;margin-bottom:8px}
details.step>summary{padding:9px 12px;font-weight:700;cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.step>summary::-webkit-details-marker{display:none}
details.step>summary::before{content:"▸"}
details.step[open]>summary::before{content:"▾"}
details.step .body{padding:0 12px 12px}
details.plain{margin-top:6px}
details.plain>summary{font-weight:700;cursor:pointer;padding:3px 0}
.meta{color:#1f2937;font-size:13px}
.md{word-break:break-word}
.md h2,.md h3,.md h4{margin:12px 0 4px;line-height:1.4}
.md h2{font-size:18px}.md h3{font-size:17px}.md h4{font-size:16px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md table{border-collapse:collapse;display:block;overflow-x:auto;margin:6px 0}
.md td,.md th{border:1px solid #64748b;padding:4px 7px;vertical-align:top}
.md th{background:#e2e8f0}
.md pre{background:#f1f5f9;border:1px solid #94a3b8;padding:8px;overflow-x:auto;white-space:pre-wrap;font-size:14px;border-radius:6px}
.md code{background:#e2e8f0;padding:0 4px;border-radius:4px}
.md blockquote{border-left:4px solid #64748b;margin:6px 0;padding:2px 10px;background:#f8fafc}
.final{border:2.5px solid #0a7d4f}
.final.bad{border-color:#b45309}
.warn{background:#fffbeb;border:1.5px solid #b45309;border-radius:8px;padding:8px 10px;margin:8px 0}
.good{background:#ecfdf5;border:1.5px solid #0a7d4f;border-radius:8px;padding:8px 10px;margin:8px 0}
.running{background:#eff6ff;border:1.5px solid #1d4ed8;border-radius:8px;padding:10px;font-weight:700;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.spin{width:20px;height:20px;border:3px solid #bfdbfe;border-top-color:#1d4ed8;border-radius:50%;animation:sp 1s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:4px}
.tabs button{flex:0 0 auto}
.tabs button.on{background:#111827;color:#fff}
.cols{display:none}
.col h4{margin:0 0 6px;font-size:16px}
.item{background:#fff;border:1.5px solid #cbd5e1;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item .t{font-weight:700;font-size:16px}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.thumb{position:relative}
.thumb img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1.5px solid #475569}
.thumb button{position:absolute;top:-9px;right:-9px;min-height:28px;width:28px;padding:0;border-radius:50%;background:#b91c1c;color:#fff;border:0}
.shot{max-width:100%;max-height:520px;border:1.5px solid #475569;border-radius:6px;display:block;margin:6px 0;cursor:zoom-in}
.drop{border:2px dashed #475569;border-radius:10px;padding:14px;text-align:center;background:#f8fafc;margin:8px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:30;max-width:92%;font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:#fff;width:100%;max-width:720px;border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;overflow:auto;cursor:zoom-out}
.zoom img{max-width:none;width:auto;display:block;margin:0 auto}
ul.issues{padding-left:20px;margin:6px 0}
ul.issues li{margin-bottom:6px}
table.err{border-collapse:collapse;width:100%;margin:6px 0;font-size:14px}
table.err td,table.err th{border:1px solid #94a3b8;padding:4px 6px;vertical-align:top;text-align:left}
table.err th{background:#e2e8f0}
.pv{font-weight:800}
.empty{text-align:center;color:#1f2937;padding:24px 10px}
.tbl{width:100%;border-collapse:collapse}
.tbl td{padding:5px 4px;border-bottom:1px solid #cbd5e1}
.tbl td:last-child{text-align:right;font-weight:700}
.copybox{background:#f8fafc;border:1.5px solid #94a3b8;border-radius:8px;padding:8px;white-space:pre-wrap;font-size:14px;max-height:260px;overflow:auto}
details.turn{background:#fff;border:2px solid #111827;border-radius:12px;margin:12px 0;overflow:hidden}
details.turn>summary{padding:10px 12px;font-weight:700;cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f1f5f9}
details.turn>summary::-webkit-details-marker{display:none}
details.turn>summary::before{content:"▸"}
details.turn[open]>summary::before{content:"▾"}
details.turn>summary .q{font-weight:400;color:#111}
.tbody{padding:8px 12px 12px}
.pendwrap{background:#fff7ed;border:2px solid #c2410c;border-radius:10px;padding:10px;margin:8px 0}
.pend{background:#fff;border:1.5px solid #cbd5e1;border-left:6px solid var(--c);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.ph{font-weight:700}
.mat{border-top:1px solid #cbd5e1;padding:6px 0}
.mtext{white-space:pre-wrap;font-size:14px;background:#f8fafc;border-radius:6px;padding:6px}
button.mini{min-height:26px;padding:0 8px;font-size:13px;margin-left:8px}
.composer{border:2px solid #1d4ed8}
@media (min-width:1024px){
  body{padding-bottom:0}
  header{align-items:center;min-height:52px}
  nav{top:0;bottom:auto;left:auto;right:12px;display:flex;background:transparent;border:0;padding:0;z-index:7}
  nav button{min-height:52px;background:transparent;color:#e5e7eb;font-size:15px;padding:0 16px}
  nav button.on{background:#374151;color:#fff}
  main{max-width:1320px;padding:14px 24px}
  .newgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
  .mob{display:none!important}
  .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
  #toast{bottom:30px}
}
</style>
</head>
<body>
<header><h1>🧠 AI Council</h1><small id="ver"></small></header>
<main id="main"></main>
<nav>
  <button id="nav-new" onclick="go('new')">＋ 新主題</button>
  <button id="nav-topics" onclick="go('topics')">📚 主題</button>
  <button id="nav-settings" onclick="go('settings')">⚙️ 設定</button>
</nav>
<div id="modal"></div>
<div id="toast"></div>
<script>

'use strict';
const APP_VERSION = '1.2.0';
const FENCE = '```';

/* ===================== 基本定義 ===================== */
const P = {
  openai:    { name: 'ChatGPT', color: '#0a7d4f' },
  anthropic: { name: 'Claude',  color: '#c2410c' },
  gemini:    { name: 'Gemini',  color: '#1d4ed8' }
};
const PROVS = ['openai', 'anthropic', 'gemini'];
const N = p => (P[p] ? P[p].name : p);
const MODES = {
  mutual:  { name: '互參整合', desc: '三家各自分析 → 互相參考後修正自己的分析 → 主整合者產出最終版（7 次）' },
  relay:   { name: '接力審查', desc: '主寫 → 審查 → 依意見修正，自動來回，直到通過或達到輪數上限' },
  compare: { name: '三方比較', desc: '三家各自獨立回答，並排查看（3 次）' },
  quick:   { name: '快速驗證', desc: '三家回答＋裁判總結（4 次）' },
  deep:    { name: '深度互審（舊版）', desc: '舊版模式', hidden: true }
};
const EXEC = { auto: '自動（API）', semi: '半自動（貼上）' };
const STATUS = {
  running:        ['執行中', '#1d4ed8'],
  paused:         ['已暫停', '#374151'],
  passed:         ['✅ 驗證通過', '#0a7d4f'],
  passed_arbiter: ['✅ 經複審通過', '#0a7d4f'],
  unverified:     ['⚠️ 未通過驗證', '#b45309'],
  need_evidence:  ['📎 待補資料', '#b45309'],
  disputed:       ['⚖️ 意見分歧', '#7c3aed'],
  needs_decision: ['❓ 待你判定', '#b45309'],
  error:          ['❌ 中斷，可續跑', '#b91c1c'],
  done:           ['✅ 完成', '#0a7d4f']
};
const VERD = {
  PASS:          ['通過', '#0a7d4f'],
  REVISE:        ['需修改', '#b45309'],
  NEED_EVIDENCE: ['待補資料', '#b45309'],
  DISAGREE:      ['有爭議', '#7c3aed'],
  UNKNOWN:       ['無法解析', '#b91c1c']
};
const AUX_TYPES = ['note', 'imgprompt', 'imgcheck'];
const ERR_TYPE = { text: '文字', number: '數字', missing: '遺漏', extra: '多餘', layout: '版面' };
const STEP_LABEL = { answer: '① 各自分析', refine: '② 參考另外兩家後修正', integrate: '③ 整合最終版', draft: '主寫第 1 版', review: '審查', revise: '依審查意見修正', arbitrate: '第三方複審', judge: '裁判總結', cross: '互審', imgcheck: '圖檔校對' };
const BG_FIELDS = [['openai', 'ChatGPT 對話的交接摘要'], ['anthropic', 'Claude 對話的交接摘要'], ['gemini', 'Gemini 對話的交接摘要'], ['user', '你的補充說明']];

/* ===================== 提示詞 ===================== */
const AUTHOR_SYS = `你是「主寫者」。請用繁體中文，針對使用者的問題給出完整、結構清楚的回答。
規則：
1. 若有原始資料（文字或圖片），所有數字、事實一律以原始資料為準，不可編造，也不可把推估寫成事實。
2. 需要計算的地方，列出計算式。
3. 無法從資料確認的內容，明確標註「待查證」。
4. 直接給出內容，不要寒暄。`;

const REVIEWER_SYS = `你是「審查者」，負責嚴格檢查另一個 AI 的回答。用繁體中文。
檢查重點：事實錯誤、數字或計算錯誤、與原始資料不符、推論漏洞、重大遺漏、結論是否站得住。
判定規則：
- PASS：沒有重大問題（只剩小瑕疵也可以 PASS，小瑕疵列為 minor）。
- REVISE：有至少一個重大問題（major），需要修改。
- NEED_EVIDENCE：缺少關鍵資料，不向使用者索取就無法判斷。
- DISAGREE：主寫者上一輪「不接受」你的某個重大意見，你看過他的理由後仍認為自己正確。把堅持的意見 id 列在 disputed_ids。
不要為了挑錯而挑錯；已經修正的問題不要重複提出；主寫者理由正確時要接受。
輸出格式：只輸出一個 JSON 區塊，不要有其他文字：
${FENCE}json
{"verdict":"PASS","summary":"一句話總評","issues":[{"id":1,"severity":"major","problem":"問題描述","suggestion":"修改建議"}],"evidence_needed":[],"disputed_ids":[]}
${FENCE}
verdict 只能是 PASS、REVISE、NEED_EVIDENCE、DISAGREE 其中之一；severity 只能是 major 或 minor。`;

const REVISER_SYS = `你是「主寫者」，正在依照審查意見修改自己的回答。用繁體中文。
對每一條審查意見決定 accept（接受並修改）或 reject（不接受，必須說明具體理由與依據）。
不要盲目接受：審查者也可能錯，若原始資料支持你的版本就 reject 並說明。
若有「第三方複審裁定」，裁定結果必須遵循。
輸出格式：先輸出一個 JSON 區塊，接著單獨一行「===修正版===」，之後是修正後的「完整全文」（不是只寫修改處）：
${FENCE}json
{"responses":[{"id":1,"decision":"accept","reason":"說明"}]}
${FENCE}
===修正版===
（完整修正後全文）`;

const ARBITER_SYS = `你是「第三方複審」。主寫者與審查者對某些意見無法取得共識，由你獨立裁定。用繁體中文。
以原始資料與事實為唯一依據，不偏袒任何一方。
只輸出一個 JSON 區塊：
${FENCE}json
{"rulings":[{"id":1,"winner":"author","reason":"裁定理由"}],"summary":"整體說明"}
${FENCE}
winner 只能是 author（主寫者有理）或 reviewer（審查者有理）。`;

const REFINE_SYS = `你已經獨立完成了一份分析。現在請閱讀另外兩位 AI 的分析，用繁體中文：
1. 吸收對方正確且有價值的觀點、數據或角度，補進你的分析。
2. 修正你自己的錯誤或遺漏。
3. 你認為對方錯的地方不要採納。
4. 一律以原始資料為準。
輸出：先輸出「修正後的完整分析」（不是只寫修改處），最後加一節「## 修改說明」，條列：改了什麼、參考了誰的哪一點、哪些不採納及原因。`;

const INTEGRATE_SYS = `你是「主整合者」。三位 AI 已各自分析，並互相參考後修正了自己的版本。請根據這三份修正版產出最終版本。用繁體中文，一律以原始資料為準。
要求：
1. 最終版要完整、可以直接使用，結構清楚。
2. 三方一致的內容直接採用；有分歧時，依原始資料與推論品質取捨。
3. 數字與計算要再核對一次。
輸出：先輸出最終版全文，最後加一節「## 整合說明」，條列：主要採用誰的哪些觀點、仍有分歧之處與你的取捨理由、待查證事項。`;

const CROSS_SYS = `你是審查者。請檢查另外兩位 AI 的回答，用繁體中文、Markdown 條列：
1. 事實或數字錯誤
2. 推論漏洞
3. 重要遺漏
4. 你認為最可信的論點（註明是誰的）
若發現你自己的回答也有錯，一併指出。以原始資料為準。`;

const JUDGE_SYS = `你是裁判，綜合多位 AI 的回答（以及互審意見）產出最終報告。用繁體中文，一律以原始資料為準。
必須依序使用以下五個標題：
## 三方共識
## 觀點分歧
## 數據與邏輯錯誤
## 遺漏與待查證
## 最終修正版
「觀點分歧」要寫明誰主張什麼；「最終修正版」要是一份可以直接使用的完整答案。`;

const IMGPROMPT_SYS = `你要撰寫一段給 ChatGPT 的「一頁式資訊圖」生圖指令。用繁體中文。
要求：
1. 圖上所有文字必須是繁體中文（專有名詞、英文縮寫可保留）。
2. 逐字列出圖上要出現的標題、小標、數字、標籤、結論句，並明確要求 ChatGPT 照抄，不可改寫、不可自行增減數字。
3. 指定版面：標題區、重點區塊、表格或圖表、結論區，以及各區塊的位置。
4. 數字、單位、百分比、正負號必須與內容完全一致。
5. 要求高對比、字體清楚、不要過多裝飾。
只輸出可以直接貼給 ChatGPT 的指令本文，不要任何說明。`;

const IMGCHECK_SYS = `你是圖檔校對員。以【最終版內容】為唯一標準（若有【生圖指令】，其中列出的文字也要逐字比對），逐字、逐數字檢查圖片。用繁體中文。
檢查項目：數字、單位、百分比、正負號、錯字、簡體字或亂碼、漏掉的重點、多出來的錯誤內容、標題與標籤、表格欄位對應。
若有【上一張的錯誤清單】，要確認是否已修正，並檢查是否出現新的錯誤。
只輸出一個 JSON 區塊：
${FENCE}json
{"verdict":"PASS","summary":"一句話總評","errors":[{"id":1,"location":"位置（例如：右上表格第2列）","expected":"應為","actual":"圖上實際","type":"number"}],"fix_prompt":"可直接貼給 ChatGPT 的修正指令"}
${FENCE}
verdict 只能是 PASS（沒有錯誤）或 REVISE；type 只能是 text、number、missing、extra、layout。
fix_prompt 要逐條寫明位置與正確內容，並要求 ChatGPT 其他部分完全保持不變；verdict 為 PASS 時 fix_prompt 留空字串。`;



const HANDOFF_PROMPT = `請為這個對話寫一份「交接摘要」，我要轉到另一個工具繼續討論。用繁體中文，照以下格式：
1. 主題與核心問題（要回答誰、回答什麼）
2. 已提供的資料清單（截圖、逐字稿、報表各是什麼內容）
3. 關鍵數字：逐項列出，附單位與來源，不可省略或四捨五入
4. 目前已確認的結論
5. 尚未解決的問題、待查證事項
6. 討論中出現過的分歧或被推翻的看法
只寫事實與結論，不要寫建議或客套話。`;

const DIGEST_SYS = `你負責把一個長期討論的主題整理成「前情摘要」，之後的分析會用這份摘要取代原本的長篇資料與討論。用繁體中文，照以下格式：
1. 主題與核心問題
2. 已提供的資料清單（每份資料是什麼內容）

function deepMerge(a, b) {
  for (const k in b) {
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') deepMerge(a[k], b[k]);
    else a[k] = b[k];
  }
  return a;
}

/* ===================== IndexedDB ===================== */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('ai-council', 1);
      r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('sessions')) d.createObjectStore('sessions', { keyPath: 'id' }); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  req(mode, fn) {
    return new Promise((res, rej) => {
      const q = fn(this.db.transaction('sessions', mode).objectStore('sessions'));
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  },
  put(s) { return this.req('readwrite', st => st.put(s)); },
  all()  { return this.req('readonly', st => st.getAll()); },
  del(id){ return this.req('readwrite', st => st.delete(id)); }
};

function sumSteps(list) {

  for (const st of list) {
    if (st.cost != null) { c += st.cost; has = true; }
    tin += st.tin || 0; tout += st.tout || 0;
    if (st.provider && st.status === 'ok' && !st.template) { if (st.manual) manual++; else calls++; }
  }
  return { c: has ? c : null, tin, tout, calls, manual };
}
const totals = t => sumSteps(t.steps);

function monthStats() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const r = { openai: 0, anthropic: 0, gemini: 0, total: 0, missing: false };
  for (const tp of TOPICS.values()) for (const st of tp.turns.flatMap(t => t.steps).concat(tp.auxSteps || [])) {

/* 簡易 Markdown */
function md(src) {
  if (!src) return '';
  const inl = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const L = String(src).replace(/\r/g, '').split('\n'); const out = []; let i = 0;
  const isList = l => /^\s*([-*+]|\d+[.)])\s+/.test(l);
  const isTbl = l => /^\s*\|.*\|\s*$/.test(l);
  while (i < L.length) {
    const l = L[i];
    if (/^\s*```/.test(l)) { const b = []; i++; while (i < L.length && !/^\s*```/.test(L[i])) { b.push(L[i]); i++; } i++; out.push('<pre>' + esc(b.join('\n')) + '</pre>'); continue; }
    const h = l.match(/^(#{1,6})\s+(.*)/);
    if (h) { const n = Math.min(h[1].length + 1, 4); out.push(`<h${n}>${inl(h[2])}</h${n}>`); i++; continue; }
    if (isTbl(l) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) {
      const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => inl(c.trim()));
      let t = '<table><tr>' + cells(l).map(c => `<th>${c}</th>`).join('') + '</tr>'; i += 2;
      while (i < L.length && isTbl(L[i])) { t += '<tr>' + cells(L[i]).map(c => `<td>${c}</td>`).join('') + '</tr>'; i++; }
      out.push(t + '</table>'); continue;
    }
    if (isList(l)) {
      const ord = /^\s*\d/.test(l); const it = [];
      while (i < L.length && isList(L[i])) { it.push(L[i].replace(/^\s*([-*+]|\d+[.)])\s+/, '')); i++; }
      out.push((ord ? '<ol>' : '<ul>') + it.map(x => '<li>' + inl(x) + '</li>').join('') + (ord ? '</ol>' : '</ul>')); continue;
    }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (/^>\s?/.test(l)) { const b = []; while (i < L.length && /^>\s?/.test(L[i])) { b.push(inl(L[i].replace(/^>\s?/, ''))); i++; } out.push('<blockquote>' + b.join('<br>') + '</blockquote>'); continue; }
    if (!l.trim()) { i++; continue; }
    const p = [];
    while (i < L.length && L[i].trim() && !/^\s*```/.test(L[i]) && !/^#{1,6}\s/.test(L[i]) && !isList(L[i]) && !isTbl(L[i]) && !/^>\s?/.test(L[i])) { p.push(inl(L[i])); i++; }
    if (!p.length) { p.push(inl(l)); i++; }
    out.push('<p>' + p.join('<br>') + '</p>');
  }
  return out.join('');
}

function parseJSON(t) {
  if (!t) return null;
  const m = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  const s = m ? m[1] : t;
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b < a) return null;
  try { return JSON.parse(s.slice(a, b + 1)); } catch (e) { return null; }
}

/* ===================== 呼叫三家 API ===================== */
function splitDataURL(u) { const [meta, data] = u.split(','); return { mime: (meta.match(/data:(.*?);/) || [])[1] || 'image/jpeg', data }; }
async function apiErr(p, r) {
  let j = {}; try { j = await r.json(); } catch (e) {}
  const m = j?.error?.message || j?.error?.status || r.statusText || '';
  return new Error(`${N(p)} 錯誤 ${r.status}：${m}`);
}
async function callAI(p, system, user, images) {
  const key = S.keys[p], model = S.models[p];
  if (!key) throw new Error(`${N(p)} 尚未設定 API Key`);
  if (!model) throw new Error(`${N(p)} 尚未選擇模型`);
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 300000);
  try {
    let r, j;
    if (p === 'openai') {
      r = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST', signal: ctl.signal,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, messages: [
          { role: 'system', content: system },
          { role: 'user', content: [{ type: 'text', text: user }, ...images.map(u => ({ type: 'image_url', image_url: { url: u } }))] }
        ] })
      });
      if (!r.ok) throw await apiErr(p, r);
      j = await r.json();
      return { text: j.choices?.[0]?.message?.content || '', tin: j.usage?.prompt_tokens || 0, tout: j.usage?.completion_tokens || 0 };
    }
    if (p === 'anthropic') {
      r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST', signal: ctl.signal,
        headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model, max_tokens: 8192, system, messages: [
          { role: 'user', content: [...images.map(u => { const d = splitDataURL(u); return { type: 'image', source: { type: 'base64', media_type: d.mime, data: d.data } }; }), { type: 'text', text: user }] }
        ] })
      });
      if (!r.ok) throw await apiErr(p, r);
      j = await r.json();
      let text = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
      if (j.stop_reason === 'max_tokens') text += '\n\n（⚠️ 回答過長被截斷）';
      return { text, tin: j.usage?.input_tokens || 0, tout: j.usage?.output_tokens || 0 };
    }
    if (p === 'gemini') {
      r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`, {
        method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: [
          { role: 'user', parts: [{ text: user }, ...images.map(u => { const d = splitDataURL(u); return { inline_data: { mime_type: d.mime, data: d.data } }; })] }
        ] })
      });
      if (!r.ok) throw await apiErr(p, r);
      j = await r.json();
      if (j.promptFeedback?.blockReason) throw new Error(`Gemini 拒絕回答：${j.promptFeedback.blockReason}`);
      const text = (j.candidates?.[0]?.content?.parts || []).filter(x => !x.thought).map(x => x.text || '').join('');
      const u = j.usageMetadata || {};
      return { text, tin: u.promptTokenCount || 0, tout: (u.candidatesTokenCount || 0) + (u.thoughtsTokenCount || 0) };
    }
    throw new Error('未知的 AI：' + p);
  } catch (e) {
    if (e.name === 'AbortError') throw new Error(`${N(p)} 逾時（超過 5 分鐘）`);
    if (e instanceof TypeError) throw new Error(`${N(p)} 連線失敗（網路中斷，或 App 被切到背景）`);
    throw e;
  } finally { clearTimeout(tm); }
}
async function listModels(p) {
  const key = S.keys[p]; if (!key) throw new Error('請先填 API Key');
  let r, j;
  if (p === 'openai') {
    r = await fetch('https://api.openai.com/v1/models', { headers: { 'Authorization': 'Bearer ' + key } });
    if (!r.ok) throw await apiErr(p, r); j = await r.json();
    return (j.data || []).map(m => m.id).filter(id => /^(gpt|o\d|chatgpt)/.test(id) && !/(audio|realtime|tts|transcribe|image|search|embedding)/.test(id)).sort().reverse();
  }
  if (p === 'anthropic') {
    r = await fetch('https://api.anthropic.com/v1/models?limit=100', { headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' } });
    if (!r.ok) throw await apiErr(p, r); j = await r.json();
    return (j.data || []).map(m => m.id);
  }
  r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${encodeURIComponent(key)}`);
  if (!r.ok) throw await apiErr(p, r); j = await r.json();
  return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /gemini/.test(m.name) && !/(embedding|tts|image|audio)/.test(m.name)).map(m => m.name.replace('models/', '')).sort().reverse();
}



/* ===================== 流程引擎 ===================== */
const okSteps = s => s.steps.filter(x => x.status === 'ok' && !AUX_TYPES.includes(x.type));
const drafts = s => s.steps.filter(x => x.status === 'ok' && (x.type === 'draft' || x.type === 'revise'));
const curDraft = s => { const d = drafts(s); return d[d.length - 1]; };
const content = st => (st.type === 'revise' ? st.revised : st.text);
function lastOk(s, type, beforeIdx) { const a = s.steps.slice(0, beforeIdx ?? s.steps.length).filter(x => x.status === 'ok' && x.type === type); return a[a.length - 1]; }
const turnNo = t => topicOf(t).turns.indexOf(t) + 1;

function notesOf(s) {
  const notes = s.steps.filter(x => x.type === 'note');
  return notes.length ? '\n\n【使用者補充／指示】\n' + notes.map((n, i) => `${i + 1}. ${n.text}`).join('\n') : '';
}
/* 自動模式：每次都把主題的完整脈絡送出（API 沒有記憶） */
function topicContext(tp, uptoTurn) {
  let u = `【主題】${tp.title}`;
  BG_FIELDS.forEach(([k, label]) => { if ((tp.bg[k] || '').trim()) u += `\n\n【主題背景：${label}】\n${tp.bg[k].trim()}`; });
  const d = tp.digest, matStart = d ? d.mat : 0, turnStart = d ? d.turns : 0;
  if (d) u += `\n\n【前情摘要（之前的資料與討論已整理如下）】\n${d.text}`;
  const mats = tp.materials.slice(matStart);
  if (mats.length) u += '\n\n【已提供的資料】' + mats.map((m, i) => `\n(${matStart + i + 1}) ${fmtDate(m.at)}${m.images.length ? `（附 ${m.images.length} 張圖）` : ''}\n${m.text || '（只有圖片）'}`).join('\n');
  const nImg = tp.materials.reduce((a, m) => a + m.images.length, 0);
  if (nImg) u += `\n（資料共附 ${nImg} 張圖片，依資料順序附上）`;
  const prev = tp.turns.slice(turnStart, uptoTurn).filter(x => x.final);
  if (prev.length) u += '\n\n【之前的討論】' + prev.map(x => `\n第 ${tp.turns.indexOf(x) + 1} 問：${x.question}\n最終結論：\n${x.final}`).join('\n');
  return u;
}
function ctxAuto(t) {
  const tp = topicOf(t);
  return topicContext(tp, tp.turns.indexOf(t)) + `\n\n【這一問】\n${t.question || '（請依資料分析）'}` + notesOf(t);
}
/* 半自動模式：網頁對話已有前面的脈絡，只送新的部分 */
const newMats = (t, p) => { const tp = topicOf(t); return tp.materials.slice((tp.sent || {})[p] || 0); };
function ctxSemi(t, p) {
  const tp = topicOf(t), idx = tp.turns.indexOf(t);
  let u = '';
  if (!t.steps.some(x => x.provider === p && x.status === 'ok' && !AUX_TYPES.includes(x.type))) {
    const prev = tp.turns.slice(0, idx).filter(x => x.final).pop();

  }

  }
  return u + `【這一問】\n${t.question || '（請依資料分析）'}` + notesOf(t);
}
const ctx = (t, p) => (t.exec === 'semi' ? ctxSemi(t, p) : ctxAuto(t));

function fmtIssues(a) { if (!a || !a.length) return '（無）'; return a.map(i => `#${i.id} [${i.severity === 'major' ? '重大' : '次要'}] ${i.problem || ''}${i.suggestion ? `\n   建議：${i.suggestion}` : ''}`).join('\n'); }

function fmtRulings(a) { if (!a || !a.length) return '（無）'; return a.map(r => `#${r.id} 判 ${r.winner === 'reviewer' ? '審查者' : '主寫者'} 有理：${r.reason || ''}`).join('\n'); }
function fmtImgErrs(a) { if (!a || !a.length) return '（無）'; return a.map(e => `#${e.id} [${ERR_TYPE[e.type] || e.type || ''}] ${e.location || ''}：應為「${e.expected || ''}」，圖上為「${e.actual || ''}」`).join('\n'); }

function nextRelay(s) {
  const ok = okSteps(s);
  if (!drafts(s).length) return { type: 'draft' };
  const last = ok[ok.length - 1];
  const nRev = ok.filter(x => x.type === 'review').length;
  const max = s.config.rounds;
  switch (last.type) {
    case 'draft': case 'revise': return nRev >= max ? { type: 'end', status: 'unverified' } : { type: 'review' };
    case 'force': return { type: 'review' };
    case 'review': {
      const v = last.verdict;

const RUNNING = new Set(), PAUSE = new Set(), AUX = new Set();
let wakeLock = null;
async function lockWake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
function releaseWake() { if (!RUNNING.size && !AUX.size && wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }

function budgetOK() {
  const ms = monthStats();
  return !(S.budget > 0 && ms.total >= S.budget && !confirm(`本月已用 ${money(ms.total)}，已達預算 $${S.budget}。仍要執行嗎？`));
}
function keysOK(list) {
  const miss = list.filter(p => !S.keys[p] || !S.models[p]);
  if (miss.length) { toast(`請先到設定填好 ${miss.map(N).join('、')} 的 Key 與模型`); return false; }

}
const needProvs = (c, mode) => (mode === 'relay' ? [c.author, c.reviewer, c.arbiter].filter(Boolean) : PROVS);

async function run(s) {
  if (RUNNING.has(s.id) || AUX.has(s.id)) return;
  if (s.exec !== 'semi') { if (!keysOK(needProvs(s.config, s.mode)) || !budgetOK()) return; }
  RUNNING.add(s.id); PAUSE.delete(s.id); s.status = 'running';
  await save(s); refresh(); if (s.exec !== 'semi') lockWake();
  try {
    for (let guard = 0; guard < 40; guard++) {
      if (PAUSE.has(s.id)) { s.status = 'paused'; break; }
      const a = nextAction(s);
      if (a.type === 'end') { s.status = a.status; finalize(s); break; }
      if (a.type === 'wait') { s.status = a.status; break; }
      const before = s.steps.filter(x => x.status === 'error').length;
      await exec(s, a);
      s.current = null;

    s.status = 'error';
    s.steps.push({ id: uid(), type: 'sys', status: 'error', error: String(e.message || e), at: Date.now() });
  } finally {
    s.current = null; s.pending = []; RUNNING.delete(s.id); PAUSE.delete(s.id);
    await save(s); releaseWake(); refresh();

    <div class="hint">${NT.exec === 'semi'

async function createTopic() {

/* ---------- 主題列表 ---------- */
function renderTopics() {

  setMain(`<div class="btns" style="margin-top:0"><button class="primary" onclick="go('new')">＋ 新主題</button></div>` + (list.length ? list.map(tp => {
    const t = topicTotals(tp), last = tp.turns[tp.turns.length - 1];
    return `<div class="item" onclick="openTopic('${tp.id}')"><div class="t">${esc(tp.title)}</div>
      <div class="meta">${tp.exec === 'semi' ? '半自動' : '自動'}　${tp.turns.length} 問　${tp.materials.length} 份資料　更新 ${fmtDate(tp.updatedAt)}${t.c != null ? '　' + money(t.c) : ''}</div>
      <div style="margin-top:4px">${last ? stBadge(last.status) : badge('尚未提問', '#475569')}${tp.turns.some(x => imgChecks(x).some(y => y.verdict === 'PASS')) ? ' ' + badge('🖼 圖檔通過', '#0a7d4f') : ''}</div></div>`;
  }).join('') : '<div class="empty">還沒有主題。按「＋ 新主題」開始。</div>'));
}

/* ---------- 步驟卡片 ---------- */
function stepTitle(s, st) {
  const n = st.provider ? N(st.provider) : '';
  switch (st.type) {
    case 'draft': return `第 1 版 · ${n} 主寫`;
    case 'revise': return `第 ${drafts(s).indexOf(st) + 1} 版（依審查修正）· ${n}`;
    case 'review': return `第 ${st.round || '?'} 輪審查 · ${n}`;
    case 'arbitrate': return `第三方複審裁定 · ${n}`;
    case 'answer': return `① ${n} 各自分析`;
    case 'refine': return `② ${n} 參考他人後的修正版`;
    case 'integrate': return `③ 最終整合 · ${n}`;
    case 'cross': return `${n} 的互審意見`;
    case 'judge': return `裁判總結 · ${n}`;
    case 'imgprompt': return `生圖提示詞 · ${st.template ? '範本' : n}`;
    case 'imgcheck': return `圖檔校對第 ${st.num || '?'} 張 · ${n}`;
    case 'note': return '📎 你的補充／指示';
    case 'force': return '🔁 你要求再審一輪';
    default: return '系統';
  }
}
function stepMeta(st) {
  if (!st.provider || st.status !== 'ok' || st.template) return '';
  if (st.manual) return `<div class="meta">網頁版（手動貼回）</div>`;
  return `<div class="meta">${esc(st.model || '')}　輸入 ${st.tin} / 輸出 ${st.tout} tokens　${money(st.cost)}　${(st.ms / 1000).toFixed(0)} 秒</div>`;
}
function reviewBody(s, st, isLast) {
  let h = '';
  if (st.data) {
    h += `<p><b>總評：</b>${esc(st.data.summary || '')}</p>`;
    const is = st.data.issues || [];
    if (is.length) h += '<ul class="issues">' + is.map(i => `<li>${badge(i.severity === 'major' ? '重大' : '次要', i.severity === 'major' ? '#b91c1c' : '#475569')} <b>#${esc(i.id)}</b> ${esc(i.problem)}${i.suggestion ? `<br><span class="meta">建議：${esc(i.suggestion)}</span>` : ''}</li>`).join('') + '</ul>';
    const ev = st.data.evidence_needed || [];
    if (ev.length) h += `<div class="warn"><b>需要你補充：</b><ul class="issues">${ev.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
    if ((st.data.disputed_ids || []).length) h += `<p class="meta">堅持的爭議意見：#${st.data.disputed_ids.map(esc).join('、#')}</p>`;
  } else h += `<div class="warn">審查結果格式無法解析，以下是原文。請你直接改判。</div><div class="md">${md(st.text)}</div>`;
  if (st.originalVerdict) h += `<p class="meta">原判定：${VERD[st.originalVerdict]?.[0] || st.originalVerdict}，已由你改判</p>`;
  if (isLast && !RUNNING.has(s.id)) h += `<div class="btns"><button onclick="override('${s.id}','${st.id}','PASS')">✅ 改判通過</button><button onclick="override('${s.id}','${st.id}','REVISE')">✏️ 改判需修改</button></div>`;
  return h;
}
function stepCard(s, st, opts = {}) {
  const color = st.provider ? P[st.provider].color : '#475569';
  let title = stepTitle(s, st), extra = '', body = '';
  if (st.status === 'error') { title = '❌ ' + title + ' 失敗'; body = `<div class="warn">${esc(st.error)}</div><p class="meta">按「續跑」會從這一步重新執行。</p>`; }
  else if (st.type === 'review') { extra = badge(VERD[st.verdict]?.[0] || st.verdict, VERD[st.verdict]?.[1] || '#475569'); body = reviewBody(s, st, opts.isLastReview); }
  else if (st.type === 'revise') {

    if (rs.length) body += '<p><b>對審查意見的回應：</b></p><ul class="issues">' + rs.map(r => `<li>${badge(r.decision === 'reject' ? '不接受' : '接受', r.decision === 'reject' ? '#7c3aed' : '#0a7d4f')} <b>#${esc(r.id)}</b> ${esc(r.reason)}</li>`).join('') + '</ul>';
    body += `<details class="plain" ${opts.isLatestDraft ? 'open' : ''}><summary>📄 修正後全文</summary><div class="md">${md(st.revised)}</div></details>`;
  }

    if (st.data) body = `<p>${esc(st.data.summary || '')}</p><ul class="issues">` + (st.data.rulings || []).map(r => `<li>${badge(r.winner === 'reviewer' ? '審查者有理' : '主寫者有理', r.winner === 'reviewer' ? '#b45309' : '#0a7d4f')} <b>#${esc(r.id)}</b> ${esc(r.reason)}</li>`).join('') + '</ul>';

  else if (st.type === 'force') body = '<p>已追加一輪審查。</p>';
  else body = `<div class="md">${md(st.text)}</div>`;
  if (st.status === 'ok' && ['draft', 'revise', 'answer', 'refine', 'judge', 'integrate'].includes(st.type)) body += `<div class="btns"><button onclick="pickFinal('${s.id}','${st.id}')">${s.finalStepId === st.id ? '⭐ 目前的最終版' : '☆ 選為最終版'}</button></div>`;
  const open = OPEN[st.id] ?? !!opts.defOpen;
  return `<details class="step" style="--c:${color}" ${open ? 'open' : ''} ontoggle="OPEN['${st.id}']=this.open"><summary>${esc(title)} ${extra}</summary><div class="body">${stepMeta(st)}${body}</div></details>`;
}

/* ---------- 半自動：待貼上卡片 ---------- */

}
async function copyMsg(tid, pid) {

}

/* ---------- 每一問 ---------- */
function finalCard(s) {
  if (!s.final) return '';
  const bad = s.status === 'unverified' || s.status === 'disputed';
  const src = s.steps.find(x => x.id === s.finalStepId);
  let h = `<section class="card final ${bad ? 'bad' : ''}"><h3>${bad ? '⚠️ 目前版本（尚未通過驗證）' : '⭐ 最終版本'}${s.finalManual ? '（你選定）' : ''}</h3>`;
  if (src && src.provider) h += `<div class="meta">來源：${esc(stepTitle(s, src))}</div>`;
  if (s.status === 'unverified') {
    const rv = lastOk(s, 'review');
    const majors = (rv?.data?.issues || []).filter(i => i.severity === 'major');
    h += `<div class="warn">已達 ${s.config.rounds} 輪上限，仍有未解決的問題，不能視為驗證通過。${majors.length ? '<ul class="issues">' + majors.map(i => `<li><b>#${esc(i.id)}</b> ${esc(i.problem)}</li>`).join('') + '</ul>' : ''}可以「多跑一輪」，或補充資料後再審。</div>`;
  }
  h += `<div class="md">${md(s.final)}</div><div class="btns"><button class="primary" onclick="copyText(T('${s.id}').final,'已複製最終版')">📋 複製最終版</button></div></section>`;
  return h;
}
function imgSection(s) {

  else h += `<div class="btns"><button class="primary" ${busy ? 'disabled' : ''} onclick="genImgPrompt('${s.id}')">🎨 產生生圖提示詞</button></div><div class="hint">${s.exec === 'semi' ? '用固定範本把最終版包成生圖指令（不需呼叫 AI）。' : `由 ${N(S.imgAI)} 根據最終版，逐字列出圖上要出現的文字與數字。`}</div>`;

  h += `<div class="lbl">② 圖檔校對（${N(S.imgAI)} 以最終版為準逐項比對）</div>`;
  const oks = imgChecks(s).filter(x => x.status === 'ok');
  imgChecks(s).forEach(st => {
    if (st.status === 'error') { h += `<div class="warn">第 ${st.num || '?'} 張校對失敗：${esc(st.error)}</div>`; return; }
    const d = st.data;
    const vb = st.verdict === 'PASS' ? badge('通過', '#0a7d4f') : st.verdict === 'REVISE' ? badge(`${(d?.errors || []).length} 處錯誤`, '#b45309') : badge('無法解析', '#b91c1c');

    if (d) {

      if ((d.errors || []).length) b += `<table class="err"><tr><th>#</th><th>位置</th><th>應為</th><th>圖上</th><th>類型</th></tr>${d.errors.map(e => `<tr><td>${esc(e.id)}</td><td>${esc(e.location)}</td><td><b>${esc(e.expected)}</b></td><td>${esc(e.actual)}</td><td>${esc(ERR_TYPE[e.type] || e.type || '')}</td></tr>`).join('')}</table>`;

      if (d.fix_prompt && st.verdict !== 'PASS') b += `<div class="lbl">給 ChatGPT 的修正指令</div><div class="copybox">${esc(d.fix_prompt)}</div><div class="btns"><button class="primary" onclick="${copyOpenGpt(`T('${s.id}').steps.find(x=>x.id==='${st.id}').data.fix_prompt`, '已複製修正指令，到 ChatGPT 貼上')}">📋 複製修正指令${gptUrl ? '並開啟 ChatGPT' : ''}</button><button onclick="copyText(fmtImgErrs(T('${s.id}').steps.find(x=>x.id==='${st.id}').data.errors),'已複製錯誤清單')">📋 複製錯誤清單</button></div>`;
    } else b += `<div class="warn">校對結果格式無法解析，原文如下。</div><div class="md">${md(st.text)}</div>`;
    h += `<details class="step" style="--c:${P[st.provider].color}" ${open ? 'open' : ''} ontoggle="OPEN['${st.id}']=this.open"><summary>第 ${st.num} 張 ${vb}</summary><div class="body">${b}</div></details>`;
  });

    <div class="btns" style="justify-content:center"><label class="btn">📷 ${pi ? '換一張' : '上傳圖檔'}<input type="file" accept="image/*" hidden onchange="this.files[0]&&setPendingImg('${s.id}',this.files[0])"></label>

  return h + '</section>';
}
document.addEventListener('paste', e => {
  if (V.view !== 'topic') return;
  const t = e.target; if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT')) return;
  const tp = TOPICS.get(V.tid); if (!tp) return;
  const target = tp.turns.filter(x => x.final).pop(); if (!target) return;
  const it = [...(e.clipboardData?.items || [])].find(x => x.type.startsWith('image/'));
  if (!it) return;
  e.preventDefault(); setPendingImg(target.id, it.getAsFile());
});
function waitHint(s) {

  const lr = lastOk(s, 'review');
  switch (s.status) {
    case 'need_evidence': {
      const ev = lr?.data?.evidence_needed || [];
      return `<div class="warn"><b>審查者需要更多資料才能判斷。</b>${ev.length ? '<ul class="issues">' + ev.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : ''}請按「補充資料」，送出後會自動重新審查。</div>`;
    }
    case 'disputed': return '<div class="warn"><b>雙方意見分歧，未啟用第三方複審。</b>請在最後一輪審查直接改判，或補充指示後續跑。</div>';
    case 'needs_decision': return '<div class="warn"><b>AI 回覆的格式無法判讀。</b>請在最後一輪直接改判（通過／需修改），或按「續跑」重試。</div>';
    case 'paused': return '<div class="warn">已暫停。可以補充資料或指示，再按「續跑」。</div>';
    case 'error': return '<div class="warn">流程中斷（網路、背景執行或 API 錯誤）。已完成的步驟都有保存，按「續跑」會從中斷處繼續。</div>';

  return '';
}
function controls(s) {
  const b = [];

  else if (!AUX.has(s.id)) {
    const n = nextAction(s);
    if (n.type !== 'end' && n.type !== 'wait') b.push(`<button class="primary" onclick="resumeS('${s.id}')">▶ 續跑</button>`);
    if (s.mode === 'relay') {

    }

function multiProcess(s) {
  const ok = s.steps.filter(x => !AUX_TYPES.includes(x.type));
  const per = p => ok.filter(x => x.provider === p && ['answer', 'refine', 'cross'].includes(x.type));
  const finalSteps = ok.filter(x => ['integrate', 'judge', 'sys'].includes(x.type));
  const latestOf = p => { const l = per(p).filter(x => x.status === 'ok'); return l[l.length - 1]; };
  const tabs = PROVS.map(p => [p, N(p)]);
  if (finalSteps.length) tabs.push(['final', s.mode === 'mutual' ? '③ 整合過程' : '⚖️ 裁判']);
  let tab = TAB[s.id]; if (!tab || !tabs.some(x => x[0] === tab)) tab = tabs[0][0];
  const list = tab === 'final' ? finalSteps : per(tab);
  let h = `<div class="mob"><div class="tabs">${tabs.map(([k, n]) => `<button class="${tab === k ? 'on' : ''}" onclick="TAB['${s.id}']='${k}';refresh()">${n}</button>`).join('')}</div>`;
  h += list.map(st => stepCard(s, st, { defOpen: tab === 'final' || st === latestOf(tab) || st.status === 'error' })).join('') || '<div class="empty">尚未產生</div>';
  h += '</div>';
  h += `<div class="cols">${PROVS.map(p => `<div class="col"><h4 style="color:${P[p].color}">${N(p)}</h4>${per(p).map(st => stepCard(s, st, { defOpen: st === latestOf(p) || st.status === 'error' })).join('') || '<div class="empty">尚未產生</div>'}</div>`).join('')}</div>`;
  h += `<div class="cols" style="grid-template-columns:1fr">${finalSteps.map(st => stepCard(s, st, {})).join('')}</div>`;
  return h;
}
function relayProcess(s) {
  const reviews = s.steps.filter(x => x.status === 'ok' && x.type === 'review');
  const lastRev = reviews[reviews.length - 1];
  const ok = okSteps(s); const lastMeaning = ok[ok.length - 1];
  const latest = curDraft(s);
  return s.steps.filter(x => x.type !== 'imgprompt' && x.type !== 'imgcheck').map(st => stepCard(s, st, {
    isLastReview: st === lastRev && lastMeaning === lastRev,
    isLatestDraft: st === latest && !s.final,
    defOpen: st === lastRev || st.status === 'error' || st.type === 'note' || (st === latest && !s.final)
  })).join('') || '<div class="empty">準備中…</div>';
}
function turnBlock(s, isLast) {
  const c = s.config, n = turnNo(s);
  const pv = p => `<span class="pv" style="color:${P[p].color}">${N(p)}</span>`;
  const cfgLine = s.mode === 'relay' ? `主寫 ${pv(c.author)} → 審查 ${pv(c.reviewer)}　複審 ${c.arbiter ? pv(c.arbiter) : '不啟用'}　最多 ${c.rounds} 輪`
    : s.mode === 'mutual' ? `三家各自分析 → 互相參考 → 主整合 ${pv(c.lead)}`
    : s.mode === 'compare' ? '三家獨立回答' : `裁判 ${pv(c.judge)}`;
  const t = totals(s);
  const open = OPEN['turn_' + s.id] ?? isLast;
  let h = `<details class="turn" id="turn_${s.id}" ${open ? 'open' : ''} ontoggle="OPEN['turn_${s.id}']=this.open">
    <summary><span>第 ${n} 問</span> ${stBadge(s.status)} <span class="q">${esc((s.question || '（依資料分析）').split('\n')[0].slice(0, 60))}</span></summary><div class="tbody">
    <div class="meta">${(MODES[s.mode] || { name: s.mode }).name}・${s.exec === 'semi' ? '半自動' : '自動'}　${cfgLine}</div>
    <div class="meta">${fmtDate(s.at)}　${s.exec === 'semi' ? `已貼回 ${t.manual} 次` : `已呼叫 ${t.calls} 次　輸入 ${t.tin} / 輸出 ${t.tout} tokens　費用 ${money(t.c)}`}</div>
    ${(s.question || '').includes('\n') ? `<details class="plain"><summary>完整問題</summary><p>${esc(s.question).replace(/\n/g, '<br>')}</p></details>` : ''}
    ${controls(s)}`;
  const cur = (RUNNING.has(s.id) && s.current) || (AUX.has(s.id) && s.auxCurrent);
  if (cur) h += `<div class="running">${s.exec === 'semi' ? '' : '<div class="spin"></div>'}<div>${esc(cur)}${s.exec === 'semi' ? '' : '<div class="meta">畫面會保持亮著；切到背景可能中斷，回來按「續跑」即可。</div>'}</div></div>`;
  h += pendingCards(s);
  h += waitHint(s) + finalCard(s) + imgSection(s);
  h += `<details class="plain" ${OPEN['proc_' + s.id] ?? !s.final ? 'open' : ''} ontoggle="OPEN['proc_${s.id}']=this.open"><summary>🧾 過程紀錄</summary>${s.mode === 'relay' ? relayProcess(s) : multiProcess(s)}</details>`;
  return h + '</div></details>';
}

function compress(file, M = 2000, q = 0.9) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height;
      if (Math.max(w, h) > M) { const r = M / Math.max(w, h); w = Math.round(w * r); h = Math.round(h * r); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('圖片讀取失敗')); };
    img.src = url;
  });
}
async function addImgs(files) { for (const f of files) { try { C.images.push(await compress(f)); } catch (e) { toast(e.message); } } refresh(); }
function pasteImg(e) {
  const items = [...(e.clipboardData?.items || [])].filter(it => it.type.startsWith('image/'));
  if (!items.length) return;
  e.preventDefault(); e.stopPropagation();
  Promise.all(items.map(it => compress(it.getAsFile()))).then(us => { C.images.push(...us); refresh(); });
}
async function storeMat(tpid) {
  const tp = TOPICS.get(tpid);
  if (!C.text.trim() && !C.images.length) return toast('請先輸入或貼上資料');
  tp.materials.push({ id: uid(), at: Date.now(), text: C.text.trim(), images: [...C.images] });
  C.text = ''; C.images = [];
  await save(tp); refresh(); toast(`已存成第 ${tp.materials.length} 份資料`);
}
async function ask(tpid) {
  const tp = TOPICS.get(tpid);
  const q = C.text.trim();
  if (!q && !C.images.length && !tp.materials.length) return toast('請先輸入問題或資料');
  if (C.mode === 'relay' && C.author === C.reviewer) return toast('主寫和審查不能是同一家');
  let judge = C.judge;
  if (C.mode === 'quick' && judge === 'rotate') { judge = PROVS[S.judgeRot % 3]; S.judgeRot++; }
  const config = { author: C.author, reviewer: C.reviewer, arbiter: C.arbiter || null, rounds: +C.rounds, judge, lead: C.lead };
  if (tp.exec !== 'semi' && !keysOK(needProvs(config, C.mode))) return go('settings');
  if (C.images.length) tp.materials.push({ id: uid(), at: Date.now(), text: '', images: [...C.images] });
  const turn = { id: uid(), at: Date.now(), question: q, mode: C.mode, config, exec: tp.exec, steps: [], status: 'running', final: null, pending: [] };
  tp.turns.push(turn); reg(tp);
  S.last = { mode: C.mode, author: C.author, reviewer: C.reviewer, arbiter: C.arbiter, rounds: +C.rounds, judge: C.judge, lead: C.lead }; saveS();
  C.text = ''; C.images = [];
  for (const x of tp.turns) if (x !== turn) OPEN['turn_' + x.id] = false;
  await save(tp); refresh();
  document.getElementById('turn_' + turn.id)?.scrollIntoView();
  run(turn);
}

function stepText(s, st) {
  if (st.status === 'error') return `（失敗）${st.error}`;
  if (st.type === 'review') return st.data ? `判定：${VERD[st.verdict]?.[0]}\n總評：${st.data.summary || ''}\n${fmtIssues(st.data.issues)}` : st.text;
  if (st.type === 'revise') return `回應：\n${fmtResp(st.data?.responses)}\n\n${st.revised}`;
  if (st.type === 'arbitrate') return st.data ? `${st.data.summary || ''}\n${fmtRulings(st.data.rulings)}` : st.text;
  if (st.type === 'imgcheck') return st.data ? `判定：${st.verdict === 'PASS' ? '通過' : '需修改'}\n總評：${st.data.summary || ''}\n${fmtImgErrs(st.data.errors)}${st.data.fix_prompt ? `\n\n修正指令：\n${st.data.fix_prompt}` : ''}` : st.text;
  if (st.type === 'force') return '要求再審一輪';
  return st.text || '';
}

    const modelField = opts.length
      ? `<select onchange="S.models.${p}=this.value;saveS()"><option value="">— 請選擇 —</option>${opts.map(m => `<option ${m === S.models[p] ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>`
      : `<input value="${esc(S.models[p])}" placeholder="先按上方按鈕載入，或直接輸入模型名稱" onchange="S.models.${p}=this.value.trim();saveS()">`;
    return `<section class="card"><h3 style="color:${P[p].color}">${N(p)}</h3>
      <div class="lbl">API Key（半自動模式不需要）</div>
      <div style="display:flex;gap:6px"><input id="key_${p}" type="password" autocomplete="off" value="${esc(S.keys[p])}" onchange="S.keys.${p}=this.value.trim();saveS()"><button onclick="const i=document.getElementById('key_${p}');i.type=i.type==='password'?'text':'password'">👁</button></div>
      <div class="btns"><button onclick="loadModels('${p}')">🔌 連線測試並載入模型</button></div>
      <div class="lbl">模型</div>${modelField}
      <div class="row"><div><div class="lbl">輸入單價（$／百萬 tokens）</div><input type="number" step="0.01" inputmode="decimal" value="${esc(S.prices[p].in)}" onchange="S.prices.${p}.in=this.value;saveS()"></div>
      <div><div class="lbl">輸出單價（$／百萬 tokens）</div><input type="number" step="0.01" inputmode="decimal" value="${esc(S.prices[p].out)}" onchange="S.prices.${p}.out=this.value;saveS()"></div></div>
      <div class="hint">單價請照官方價目表填入所選模型的價格；沒填的話只顯示 token 數，不算金額。</div></section>`;
  }).join('') + `</div><div>
  <section class="card"><h3>🧩 輔助 AI</h3>
    <div class="lbl">產生生圖提示詞、圖檔校對、整理前情摘要</div>
    <select onchange="S.imgAI=this.value;saveS()">${PROVS.map(p => `<option value="${p}" ${S.imgAI === p ? 'selected' : ''}>${N(p)}</option>`).join('')}</select></section>
  <section class="card"><h3>💰 本月 API 費用</h3>
    <table class="tbl">${PROVS.map(p => `<tr><td>${N(p)}</td><td>${money(ms[p])}</td></tr>`).join('')}<tr><td><b>合計</b></td><td>${money(ms.total)}</td></tr></table>
    ${ms.missing ? '<div class="hint">部分呼叫未填單價，沒有計入金額。</div>' : ''}
    <div class="hint">半自動（手動貼回）用的是你的月費額度，不計入這裡。</div>
    <div class="lbl">每月預算提醒（USD，0 = 不提醒）</div>
    <input type="number" inputmode="decimal" value="${S.budget}" onchange="S.budget=+this.value||0;saveS()">
    <div class="hint">這裡只是提醒。真正的保護是到三家後台設定「硬性」花費上限。</div></section>
  <section class="card"><h3>🔒 安全說明</h3>
    <div class="hint" style="margin-top:0">API Key 只存在這台裝置的瀏覽器裡，不會寫進程式、GitHub 或備份檔。手機和電腦要各自設定一次。建議使用這個 App 專用的 Key，並在三家後台各設每月硬性上限。</div></section>
  <section class="card"><h3>💾 資料備份</h3>
    <div class="btns"><button onclick="exportAll()">⬇️ 匯出全部主題</button><label class="btn">⬆️ 匯入備份<input type="file" accept=".json,application/json" hidden onchange="importAll(this.files[0])"></label></div>
    <div class="hint">備份檔不含 API Key。可用來把主題從電腦搬到手機。</div></section>
  <div class="empty">AI Council v${APP_VERSION}</div></div></div>`);
}
async function loadModels(p) {
  S.keys[p] = document.getElementById('key_' + p).value.trim(); saveS();
  toast(`${N(p)} 連線中…`);
  try {
    const l = await listModels(p);
    S.lists[p] = l; if (!S.models[p] && l.length) S.models[p] = l[0];
    saveS(); renderSettings(); toast(`${N(p)} 連線成功，共 ${l.length} 個模型`);
  } catch (e) { toast(String(e.message || e)); }
}
function exportAll() {
  const data = { app: 'ai-council', version: APP_VERSION, exportedAt: new Date().toISOString(), topics: [...TOPICS.values()] };
  download(JSON.stringify(data), `AI_Council_備份_${fmtDate(Date.now()).replace(/[/: ]/g, '')}.json`, 'application/json');
}
async function importAll(file) {
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    const list = (d.topics || []).concat((d.sessions || []).map(migrate));
    for (const tp of list) { for (const t of tp.turns) { if (t.status === 'running') t.status = 'paused'; t.pending = []; } reg(tp); await save(tp); }
    toast(`已匯入 ${list.length} 個主題`); renderSettings();
  } catch (e) { toast('匯入失敗：檔案格式不符'); }
}

/* ===================== 啟動 ===================== */
(async function init() {
  document.getElementById('ver').textContent = 'v' + APP_VERSION;
  await DB.open();
  for (const rec of await DB.all()) {
    let tp = rec;
    if (rec.kind !== 'topic') { tp = migrate(rec); await DB.put(JSON.parse(JSON.stringify(tp))); }
    for (const t of tp.turns) { if (t.status === 'running') t.status = 'paused'; t.pending = []; }
    tp.sent = tp.sent || {}; tp.auxSteps = tp.auxSteps || [];
    reg(tp);
  }
  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
</body>

<!DOCTYPE html>

<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#111;background:#eef2f7;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:10px 14px;display:flex;align-items:baseline;gap:8px;min-height:48px}
header h1{font-size:18px;margin:0}

main{max-width:920px;margin:0 auto;padding:10px}

textarea,input,select{width:100%;font:inherit;color:#111;border:1.5px solid #475569;border-radius:8px;padding:8px;background:#fff}

.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1.5px solid #111827;padding-bottom:env(safe-area-inset-bottom);z-index:6}

.badge{display:inline-block;padding:1px 8px;border-radius:999px;color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
details.step{background:#fff;border:1.5px solid #cbd5e1;border-left:6px solid var(--c,#475569);border-radius:10px;margin-bottom:8px}
details.step>summary{padding:9px 12px;font-weight:700;cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.step>summary::-webkit-details-marker{display:none}
details.step>summary::before{content:"▸"}
details.step[open]>summary::before{content:"▾"}

.meta{color:#1f2937;font-size:13px}
.md{word-break:break-word}
.md h2,.md h3,.md h4{margin:12px 0 4px;line-height:1.4}
.md h2{font-size:18px}.md h3{font-size:17px}.md h4{font-size:16px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md table{border-collapse:collapse;display:block;overflow-x:auto;margin:6px 0}

.warn{background:#fffbeb;border:1.5px solid #b45309;border-radius:8px;padding:8px 10px;margin:8px 0}
.good{background:#ecfdf5;border:1.5px solid #0a7d4f;border-radius:8px;padding:8px 10px;margin:8px 0}
.running{background:#eff6ff;border:1.5px solid #1d4ed8;border-radius:8px;padding:10px;font-weight:700;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.spin{width:20px;height:20px;border:3px solid #bfdbfe;border-top-color:#1d4ed8;border-radius:50%;animation:sp 1s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:4px}
.tabs button{flex:0 0 auto}
.tabs button.on{background:#111827;color:#fff}
.cols{display:none}
.col h4{margin:0 0 6px;font-size:16px}
.item{background:#fff;border:1.5px solid #cbd5e1;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item .t{font-weight:700;font-size:16px}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.thumb{position:relative}
.thumb img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1.5px solid #475569}
.thumb button{position:absolute;top:-9px;right:-9px;min-height:28px;width:28px;padding:0;border-radius:50%;background:#b91c1c;color:#fff;border:0}
.shot{max-width:100%;max-height:520px;border:1.5px solid #475569;border-radius:6px;display:block;margin:6px 0;cursor:zoom-in}
.drop{border:2px dashed #475569;border-radius:10px;padding:14px;text-align:center;background:#f8fafc;margin:8px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:30;max-width:92%;font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:#fff;width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;overflow:auto;cursor:zoom-out}
.zoom img{max-width:none;width:auto;display:block;margin:0 auto}
ul.issues{padding-left:20px;margin:6px 0}
ul.issues li{margin-bottom:6px}
table.err{border-collapse:collapse;width:100%;margin:6px 0;font-size:14px}
table.err td,table.err th{border:1px solid #94a3b8;padding:4px 6px;vertical-align:top;text-align:left}
table.err th{background:#e2e8f0}
.pv{font-weight:800}
.empty{text-align:center;color:#1f2937;padding:24px 10px}
.tbl{width:100%;border-collapse:collapse}
.tbl td{padding:5px 4px;border-bottom:1px solid #cbd5e1}
.tbl td:last-child{text-align:right;font-weight:700}
.copybox{background:#f8fafc;border:1.5px solid #94a3b8;border-radius:8px;padding:8px;white-space:pre-wrap;font-size:14px;max-height:260px;overflow:auto}
details.turn{background:#fff;border:2px solid #111827;border-radius:12px;margin:12px 0;overflow:hidden}
details.turn>summary{padding:10px 12px;font-weight:700;cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f1f5f9}
details.turn>summary::-webkit-details-marker{display:none}
details.turn>summary::before{content:"▸"}
details.turn[open]>summary::before{content:"▾"}
details.turn>summary .q{font-weight:400;color:#111}
.tbody{padding:8px 12px 12px}
.pendwrap{background:#fff7ed;border:2px solid #c2410c;border-radius:10px;padding:10px;margin:8px 0}
.pend{background:#fff;border:1.5px solid #cbd5e1;border-left:6px solid var(--c);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.ph{font-weight:700}
.mat{border-top:1px solid #cbd5e1;padding:6px 0}
.mtext{white-space:pre-wrap;font-size:14px;background:#f8fafc;border-radius:6px;padding:6px}
button.mini{min-height:26px;padding:0 8px;font-size:13px;margin-left:8px}
.composer{border:2px solid #1d4ed8}
.ckrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ck{border-radius:6px;padding:2px 8px;font-weight:700;font-size:14px}
.ck.ok{background:#ecfdf5;color:#0a7d4f}.ck.er{background:#fef2f2;color:#b91c1c}.ck.un{background:#f5f3ff;color:#7c3aed}.ck.rd{background:#f1f5f9;color:#334155}
.tplrow{border-bottom:1px solid #e2e8f0;padding:8px 0}.tplrow textarea{margin-top:6px;font-size:14px}
.report{background:#f8fafc;border:1.5px solid #cbd5e1;border-radius:8px;padding:6px 10px;margin:6px 0}
.syncbar{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px;color:#1f2937}
.syncbar.err{color:#b91c1c;font-weight:700}
.steps li{margin:5px 0}
.newchat{background:#f0fdf4;border:1.5px solid #0a7d4f;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px}
.newchat ol{margin:4px 0 6px;padding-left:20px}.newchat li{margin:3px 0}
.pick{border:2px solid #1d4ed8;border-radius:10px;padding:10px;margin:8px 0;background:#fff}
.pick .rk{display:inline-block;background:#1d4ed8;color:#fff;border-radius:999px;padding:0 8px;font-weight:700;margin-right:6px}
.cand{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #e2e8f0}
.cand .cm{flex:1}
.arcbox{max-height:520px;overflow:auto;border:1.5px solid #cbd5e1;border-radius:8px;padding:6px;background:#f8fafc}
.amsg{padding:6px 8px;margin:4px 0;border-radius:6px;white-space:pre-wrap;font-size:14px;word-break:break-word}
.amsg.u{background:#e0f2fe}.amsg.a{background:#fff;border:1px solid #e2e8f0}
.amsg .who{font-weight:700;font-size:13px;display:block;margin-bottom:2px}
.crow{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:start;padding:6px 0;border-bottom:1px solid #e2e8f0}
.crow select{margin-top:4px}
.trow{display:flex;align-items:flex-start;gap:8px}.trow>.t,.trow>h3{flex:1}
.star{border:0;background:transparent;font-size:22px;min-height:30px;padding:0 4px;color:#94a3b8;line-height:1}
.star.on{color:#ca8a04}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.tag{display:inline-flex;align-items:center;gap:3px;background:#e0f2fe;color:#0c4a6e;border:1px solid #7dd3fc;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:600;cursor:pointer}
.tag.on{background:#0c4a6e;color:#fff}
.tag b{cursor:pointer;color:#b91c1c;margin-left:2px}
.tag small{opacity:.75}
.tagin{width:150px;min-height:28px;padding:2px 8px;font-size:13px;border-radius:999px}
.links{display:inline-flex;gap:4px;flex-wrap:wrap}
button.mini.link{margin-left:0;background:#fff}
details.folder{margin-bottom:8px}
details.folder>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border:1.5px solid #cbd5e1;border-left:6px solid var(--fc);border-radius:10px;font-weight:700}
details.folder>summary::-webkit-details-marker{display:none}
details.folder>summary .fname{flex:1;color:var(--fc)}
details.folder>summary .fcount{color:#1f2937;font-weight:400}
details.folder>summary::after{content:"›";font-size:18px;color:#475569}
details.folder[open]>summary::after{content:"⌄"}
details.folder .fbody{padding:8px 0 0 14px}
details.folder.sub>summary{padding:7px 10px;font-weight:600}
.frow{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #e2e8f0}
.frow .nm{flex:1}
.frow.sub .nm{padding-left:22px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;cursor:pointer;flex:0 0 auto}
.hit{margin-top:6px;padding:6px 8px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:6px;font-size:14px}
.hit:hover{background:#eff6ff}
mark{background:#fde68a;color:#111;padding:0 1px}
@media (min-width:1024px){
  body{padding-bottom:0}
  header{align-items:center;min-height:52px}
  nav{top:0;bottom:auto;left:auto;right:12px;display:flex;background:transparent;border:0;padding:0;z-index:7}
  nav button{min-height:52px;background:transparent;color:#e5e7eb;font-size:15px;padding:0 16px}
  nav button.on{background:#374151;color:#fff}
  main{max-width:1320px;padding:14px 24px}
  .newgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
  .mob{display:none!important}
  .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
  #toast{bottom:30px}
}
</style>

<body>
<header><h1>🧠 AI Council</h1><small id="ver"></small></header>
<main id="main"></main>
<nav>
  <button id="nav-new" onclick="go('new')">＋ 新主題</button>
  <button id="nav-topics" onclick="go('topics')">📚 主題</button>
  <button id="nav-settings" onclick="go('settings')">⚙️ 設定</button>
</nav>
<div id="modal"></div>
<div id="toast"></div>
<script>

'use strict';
const APP_VERSION = '1.11.0';
const FENCE = '```';

/* ===================== 基本定義 ===================== */
const P = {
  openai:    { name: 'ChatGPT', color: '#0a7d4f' },
  anthropic: { name: 'Claude',  color: '#c2410c' },
  gemini:    { name: 'Gemini',  color: '#1d4ed8' }
};
const PROVS = ['openai', 'anthropic', 'gemini'];
const N = p => (P[p] ? P[p].name : p);
const MODES = {
  mutual:  { name: '互參整合', desc: '三家各自分析 → 互相審查並修正自己的分析 → 主整合者產出驗證報告與最終版（7 次）' },
  relay:   { name: '接力審查', desc: '主寫 → 審查 → 依意見修正，自動來回，直到通過或達到輪數上限' },
  compare: { name: '三方比較', desc: '三家各自獨立回答，並排查看（3 次）' },
  quick:   { name: '快速驗證', desc: '三家回答＋裁判總結（4 次）' },
  single:  { name: '單一 AI', desc: '只問一家（1 次），日常小問題用；需要時可以在同一個主題改用互參整合再驗證' },
  deep:    { name: '深度互審（舊版）', desc: '舊版模式', hidden: true }
};
const EXEC = { auto: '自動（API）', semi: '半自動（貼上）' };
const STATUS = {
  running:        ['執行中', '#1d4ed8'],
  paused:         ['已暫停', '#374151'],
  passed:         ['✅ 驗證通過', '#0a7d4f'],
  passed_arbiter: ['✅ 經複審通過', '#0a7d4f'],
  unverified:     ['⚠️ 未通過驗證', '#b45309'],
  need_evidence:  ['📎 待補資料', '#b45309'],
  disputed:       ['⚖️ 意見分歧', '#7c3aed'],
  needs_decision: ['❓ 待你判定', '#b45309'],
  error:          ['❌ 中斷，可續跑', '#b91c1c'],
  done:           ['✅ 完成', '#0a7d4f']
};
const VERD = {
  PASS:          ['通過', '#0a7d4f'],
  REVISE:        ['需修改', '#b45309'],
  NEED_EVIDENCE: ['待補資料', '#b45309'],
  DISAGREE:      ['有爭議', '#7c3aed'],
  UNKNOWN:       ['無法解析', '#b91c1c']
};
const AUX_TYPES = ['note', 'imgprompt', 'imgcheck'];
const ERR_TYPE = { text: '文字', number: '數字', missing: '遺漏', extra: '多餘', layout: '版面' };
const STEP_LABEL = { answer: '① 各自分析', refine: '② 審查另外兩家並修正', integrate: '③ 驗證報告與最終版', draft: '主寫第 1 版', review: '審查', revise: '依審查意見修正', arbitrate: '第三方複審', judge: '裁判總結', cross: '互審', imgcheck: '圖檔校對' };
const BG_FIELDS = [['openai', 'ChatGPT 對話的交接摘要'], ['anthropic', 'Claude 對話的交接摘要'], ['gemini', 'Gemini 對話的交接摘要'], ['user', '你的補充說明']];

/* ===================== 提示詞 ===================== */
const AUTHOR_SYS = `你是「主寫者」。請用繁體中文，針對使用者的問題給出完整、結構清楚的回答。
規則：
1. 若有原始資料（文字或圖片），所有數字、事實一律以原始資料為準，不可編造，也不可把推估寫成事實。
2. 需要計算的地方，列出計算式。
3. 無法從資料確認的內容，明確標註「待查證」。
4. 直接給出內容，不要寒暄。`;

const REVIEWER_SYS = `你是「審查者」，負責嚴格檢查另一個 AI 的回答。用繁體中文。
檢查重點：事實錯誤、數字或計算錯誤、與原始資料不符、推論漏洞、重大遺漏、結論是否站得住。
判定規則：
- PASS：沒有重大問題（只剩小瑕疵也可以 PASS，小瑕疵列為 minor）。
- REVISE：有至少一個重大問題（major），需要修改。
- NEED_EVIDENCE：缺少關鍵資料，不向使用者索取就無法判斷。
- DISAGREE：主寫者上一輪「不接受」你的某個重大意見，你看過他的理由後仍認為自己正確。把堅持的意見 id 列在 disputed_ids。
不要為了挑錯而挑錯；已經修正的問題不要重複提出；主寫者理由正確時要接受。
輸出格式：只輸出一個 JSON 區塊，不要有其他文字：
${FENCE}json
{"verdict":"PASS","summary":"一句話總評","issues":[{"id":1,"severity":"major","problem":"問題描述","suggestion":"修改建議"}],"evidence_needed":[],"disputed_ids":[]}
${FENCE}
verdict 只能是 PASS、REVISE、NEED_EVIDENCE、DISAGREE 其中之一；severity 只能是 major 或 minor。`;

const REVISER_SYS = `你是「主寫者」，正在依照審查意見修改自己的回答。用繁體中文。
對每一條審查意見決定 accept（接受並修改）或 reject（不接受，必須說明具體理由與依據）。
不要盲目接受：審查者也可能錯，若原始資料支持你的版本就 reject 並說明。
若有「第三方複審裁定」，裁定結果必須遵循。
輸出格式：先輸出一個 JSON 區塊，接著單獨一行「===修正版===」，之後是修正後的「完整全文」（不是只寫修改處）：
${FENCE}json
{"responses":[{"id":1,"decision":"accept","reason":"說明"}]}
${FENCE}
===修正版===
（完整修正後全文）`;

const ARBITER_SYS = `你是「第三方複審」。主寫者與審查者對某些意見無法取得共識，由你獨立裁定。用繁體中文。
以原始資料與事實為唯一依據，不偏袒任何一方。
只輸出一個 JSON 區塊：
${FENCE}json
{"rulings":[{"id":1,"winner":"author","reason":"裁定理由"}],"summary":"整體說明"}
${FENCE}
winner 只能是 author（主寫者有理）或 reviewer（審查者有理）。`;

const REFINE_SYS = `你已經獨立完成了一份分析。現在請閱讀另外兩位 AI 的分析，分三段完成。用繁體中文，一律以原始資料為準。
最高原則：追求正確，不追求共識。不可因為另外兩家意見一致，就放棄你自己有根據的判斷；也不可為了附和而修改正確的內容。只有在對方提出更好的證據或推論時才修正。
第一段「審查」：逐一檢查另外兩家，列出事實或數字錯誤、與原始資料不一致之處、推論漏洞、重要遺漏。沒有問題就寫「未發現問題」，不要為了挑錯而挑錯。
第二段「修正後的完整分析」：完整全文，不是只寫修改處。
第三段「修改說明」：固定分五項。
輸出格式（標題都要有）：
## 一、對另外兩家的審查
## 二、修正後的完整分析
## 三、修改說明
1. 保留的觀點（以及為什麼堅持）
2. 採納的觀點（採納誰的哪一點、原因）
3. 拒絕的觀點（拒絕誰的哪一點、原因）
4. 修正的數據與推論

  },
  req(mode, fn) {
    return new Promise((res, rej) => {
      const q = fn(this.db.transaction('sessions', mode).objectStore('sessions'));
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  },
  put(s) { return this.req('readwrite', st => st.put(s)); },
  all()  { return this.req('readonly', st => st.getAll()); },
  del(id){ return this.req('readwrite', st => st.delete(id)); }
};

async function step(s, p, system, user, meta) {
  const t0 = Date.now();
  try {
    const r = s.exec === 'semi' ? await manualReply(s, p, system, user, meta)
                                : await callAI(p, system, user, meta.images ?? allImages(s));
    const st = { id: uid(), type: meta.type, provider: p, model: r.manual ? '網頁版（手動貼回）' : S.models[p], round: meta.round, text: r.text, tin: r.tin, tout: r.tout, cost: r.manual ? null : calcCost(p, r.tin, r.tout), ms: Date.now() - t0, status: 'ok', at: Date.now(), manual: !!r.manual };
    if (meta.extra) Object.assign(st, meta.extra);
    if (meta.post) meta.post(st);
    s.steps.push(st);
  } catch (e) {
    if (e.paused) { await save(s); refresh(); return; }
    s.steps.push({ id: uid(), type: meta.type, provider: p, round: meta.round, status: 'error', error: String(e.message || e), at: Date.now(), ...(meta.extra || {}) });
  }
  await save(s); refresh();
}
const postReview = st => {

const postRevise = st => {
  const parts = st.text.split(/={3,}\s*修正版\s*={3,}/);
  st.data = parseJSON(parts[0]) || { responses: [] };
  st.revised = (parts.length > 1 ? parts.slice(1).join('\n') : st.text.replace(/```(?:json)?[\s\S]*?```/, '')).trim();
};
async function exec(s, a) {

  const nRev = ok.filter(x => x.type === 'review').length;
  const semi = s.exec === 'semi';
  const setCur = t => { s.current = semi ? '✋ 等你把回覆貼回來：' + t : t; refresh(); };
  switch (a.type) {

    case 'review':

    case 'revise':

    case 'arbitrate':

    case 'answers': {
      setCur(`① 各自分析：${a.list.map(N).join('、')}`);
      const msgs = a.list.map(p => [p, ctx(s, p) + '\n\n請完成回答。']);
      return Promise.all(msgs.map(([p, u]) => step(s, p, AUTHOR_SYS, u, { type: 'answer' })));
    }
    case 'refine': {

      const msgs = a.list.map(p => [p, refinePrompt(s, p)]);
      return Promise.all(msgs.map(([p, u]) => step(s, p, REFINE_SYS, u, { type: 'refine' })));
    }
    case 'integrate':
      setCur(`③ ${N(c.lead)} 整合最終版`);
      return step(s, c.lead, INTEGRATE_SYS, integratePrompt(s), { type: 'integrate' });
    case 'cross': {

      return Promise.all(msgs.map(([p, u]) => step(s, p, CROSS_SYS, u, { type: 'cross' })));
    }
    case 'judge':
      setCur(`${N(c.judge)} 裁判總結`);

function finalize(s) {
  if (s.finalManual) return;
  if (s.mode === 'relay') { const d = curDraft(s); if (d) { s.final = content(d); s.finalStepId = d.id; } }
  else if (s.mode === 'single') { const a = lastOf(s, 'answer'); if (a) { s.final = a.text; s.report = ''; s.finalStepId = a.id; } }
  else { const j = okSteps(s).filter(x => x.type === 'judge' || x.type === 'integrate').pop(); if (j) { const r = splitReport(j.text); s.final = r.final; s.report = r.report; s.finalStepId = j.id; } }
}

const RUNNING = new Set(), PAUSE = new Set(), AUX = new Set();
let wakeLock = null;
async function lockWake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
function releaseWake() { if (!RUNNING.size && !AUX.size && wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (RUNNING.size || AUX.size) lockWake();
  if (syncOn() && S.sync.auto && Date.now() - (S.sync.last || 0) > 60000) syncNow(true);
});
function budgetOK() {
  const ms = monthStats();
  return !(S.budget > 0 && ms.total >= S.budget && !confirm(`本月已用 ${money(ms.total)}，已達預算 $${S.budget}。仍要執行嗎？`));
}
function keysOK(list) {
  const miss = list.filter(p => !S.keys[p] || !S.models[p]);
  if (miss.length) { toast(`請先到設定填好 ${miss.map(N).join('、')} 的 Key 與模型`); return false; }
  return true;
}
const needProvs = (c, mode) => (mode === 'relay' ? [c.author, c.reviewer, c.arbiter].filter(Boolean) : mode === 'single' ? [c.single] : PROVS);

async function run(s) {
  if (RUNNING.has(s.id) || AUX.has(s.id)) return;
  if (s.exec !== 'semi') { if (!keysOK(needProvs(s.config, s.mode)) || !budgetOK()) return; }
  RUNNING.add(s.id); PAUSE.delete(s.id); s.status = 'running';
  await save(s); refresh(); if (s.exec !== 'semi') lockWake();
  try {
    for (let guard = 0; guard < 40; guard++) {
      if (PAUSE.has(s.id)) { s.status = 'paused'; break; }
      const a = nextAction(s);
      if (a.type === 'end') { s.status = a.status; finalize(s); break; }
      if (a.type === 'wait') { s.status = a.status; break; }
      const before = s.steps.filter(x => x.status === 'error').length;
      await exec(s, a);
      s.current = null;
      if (s.steps.filter(x => x.status === 'error').length > before) { s.status = 'error'; break; }
    }
  } catch (e) {
    s.status = 'error';
    s.steps.push({ id: uid(), type: 'sys', status: 'error', error: String(e.message || e), at: Date.now() });
  } finally {
    s.current = null; s.pending = []; RUNNING.delete(s.id); PAUSE.delete(s.id);
    await save(s); releaseWake(); refresh();
    const tp = topicOf(s);
    if (!(V.view === 'topic' && V.tid === tp.id)) toast(`「${tp.title}」第 ${turnNo(s)} 問：${(STATUS[s.status] || [''])[0]}`);
  }
}
async function runAux(obj, label, fn, semi) {
  if (RUNNING.has(obj.id) || AUX.has(obj.id)) return;
  if (!semi) { if (!keysOK([S.imgAI]) || !budgetOK()) return; }
  AUX.add(obj.id); obj.auxCurrent = label; refresh(); if (!semi) lockWake();
  try { await fn(); }
  finally { AUX.delete(obj.id); obj.auxCurrent = null; if (obj.pending) obj.pending = []; await save(obj); releaseWake(); refresh(); }
}

const DONE_ST = ['done', 'passed', 'passed_arbiter'];
function snippet(text, q) {
  const t = String(text || ''), i = t.toLowerCase().indexOf(q);
  if (i < 0) return '';
  const a = Math.max(0, i - 25), b = Math.min(t.length, i + q.length + 45);
  return (a > 0 ? '…' : '') + esc(t.slice(a, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length, b)) + (b < t.length ? '…' : '');
}
function topicHits(tp, q) {
  const hits = [];
  if (tp.title.toLowerCase().includes(q)) hits.push({ kind: 'title' });
  if (tagsOf(tp).some(t => t.toLowerCase().includes(normTag(q).toLowerCase()))) hits.push({ kind: 'tag', label: '標籤', snip: tagsOf(tp).map(t => '#' + esc(t)).join(' ') });
  tp.turns.forEach((t, i) => {
    if ((t.question || '').toLowerCase().includes(q)) hits.push({ kind: 'turn', id: t.id, label: `第 ${i + 1} 問・問題`, snip: snippet(t.question, q) });
    if ((t.final || '').toLowerCase().includes(q)) hits.push({ kind: 'turn', id: t.id, label: `第 ${i + 1} 問・最終版`, snip: snippet(t.final, q) });
  });
  tp.materials.forEach((m, i) => { if ((m.text || '').toLowerCase().includes(q)) hits.push({ kind: 'mat', label: `資料 (${i + 1})`, snip: snippet(m.text, q) }); });
  BG_FIELDS.forEach(([k, label]) => { if ((tp.bg[k] || '').toLowerCase().includes(q)) hits.push({ kind: 'bg', label: `背景・${label}`, snip: snippet(tp.bg[k], q) }); });
  if (tp.archive) {
    if (tp._arc === undefined) tp._arc = tp.archive.msgs.map(m => m.t).join('\n');
    if (tp._arcLow === undefined) tp._arcLow = tp._arc.toLowerCase();
    const i = tp._arcLow.indexOf(q);
    if (i >= 0) { let n = 0, j = i; while (j >= 0 && n < 99) { n++; j = tp._arcLow.indexOf(q, j + q.length); } hits.push({ kind: 'arc', label: `原始對話內容（${n >= 99 ? '99+' : n} 處）`, snip: snippet(tp._arc.slice(Math.max(0, i - 40), i + 120), q) }); }
  }
  return hits;
}

function allTags() { const m = new Map(); for (const tp of TOPICS.values()) for (const t of tagsOf(tp)) m.set(t, (m.get(t) || 0) + 1); return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])); }
const normTag = t => String(t || '').replace(/^[#＃\s]+/, '').replace(/['"\\<>`]/g, '').trim();

  const add = String(v || '').split(/[,，\s]+/).map(normTag).filter(Boolean).filter(t => !tp.tags.includes(t));
  if (!add.length) return;
  tp.tags.push(...add); await save(tp); refresh();
  setTimeout(() => document.getElementById('tagIn')?.focus(), 0);
}
async function rmTag(id, t) { const tp = TOPICS.get(id); tp.tags = tagsOf(tp).filter(x => x !== t); await save(tp); refresh(); }
function tagChips(tp, removable) {
  return tagsOf(tp).map(t => `<span class="tag" onclick="event.stopPropagation();${removable ? '' : `Q.tag='${esc(t)}';go('topics')`}">#${esc(t)}${removable ? ` <b onclick="rmTag('${tp.id}','${esc(t)}')">✕</b>` : ''}</span>`).join('');
}
function topicItem(tp, q, hits) {
  const t = topicTotals(tp), last = tp.turns[tp.turns.length - 1];
  hits = (hits || []).filter(x => x.kind !== 'title');
  const shown = hits.slice(0, 5);
  return `<div class="item" onclick="openTopic('${tp.id}')"><div class="trow"><div class="t">${q ? snippet(tp.title, q) || esc(tp.title) : esc(tp.title)}</div><button class="star ${tp.star ? 'on' : ''}" title="收藏" onclick="event.stopPropagation();toggleStar('${tp.id}')">${tp.star ? '★' : '☆'}</button></div>
    ${tagsOf(tp).length || chatLinks(tp) ? `<div class="tagrow">${tagChips(tp)}${chatLinks(tp)}</div>` : ''}
    ${(q || Q.tag) && tp.folder && FOLDER(tp.folder) ? `<div class="meta" style="color:${fColor(FOLDER(tp.folder))}">📁 ${esc(folderPath(tp.folder))}</div>` : ''}
    <div class="meta">${tp.archive ? `📜 匯入自 ${N(tp.archive.source)}（${tp.archive.msgs.length} 則）　` : ''}${tp.exec === 'semi' ? '半自動' : '自動'}　${tp.turns.length} 問　${tp.materials.length} 份資料　更新 ${fmtDate(tp.updatedAt)}${t.c != null ? '　' + money(t.c) : ''}</div>
    <div style="margin-top:4px">${last ? stBadge(last.status) : tp.archive ? '' : badge('尚未提問', '#475569')}${tp.turns.some(x => imgChecks(x).some(y => y.verdict === 'PASS')) ? ' ' + badge('🖼 圖檔通過', '#0a7d4f') : ''}</div>
    ${shown.filter(x => x.kind !== 'tag').map(x => `<div class="hit" onclick="event.stopPropagation();openTopic('${tp.id}',${x.kind === 'turn' ? `'${x.id}'` : x.kind === 'mat' ? "'mat'" : x.kind === 'arc' ? "'arc'" : 'null'})"><b>${esc(x.label)}</b>　${x.snip}</div>`).join('')}
    ${hits.length > shown.length ? `<div class="meta">還有 ${hits.length - shown.length} 筆符合</div>` : ''}</div>`;
}
function newInFolder(fid) { NT.folder = fid; go('new'); }
function folderTree(list) {
  const valid = new Set(S.folders.map(f => f.id));
  const inF = id => list.filter(tp => tp.folder === id);
  const countTop = f => inF(f.id).length + subFolders(f.id).reduce((a, c) => a + inF(c.id).length, 0);
  const node = (f, isSub) => {
    const n = isSub ? inF(f.id).length : countTop(f);
    const key = 'f_' + f.id, open = OPEN[key] ?? n > 0;
    const col = fColor(f);
    let inner = inF(f.id).map(tp => topicItem(tp)).join('');
    if (!isSub) inner += subFolders(f.id).map(c => node(c, true)).join('');
    if (!inner) inner = '<div class="meta" style="padding:4px 2px">（沒有主題）</div>';
    return `<details class="folder ${isSub ? 'sub' : ''}" ${open ? 'open' : ''} ontoggle="OPEN['${key}']=this.open">
      <summary style="--fc:${col}"><span class="fname">${isSub ? '📂' : '📁'} ${esc(f.name)}</span><span class="fcount">${n}</span>
      <button class="mini" title="在這個資料夾新增主題" onclick="event.preventDefault();event.stopPropagation();newInFolder('${f.id}')">＋</button></summary>
      <div class="fbody">${inner}</div></details>`;
  };
  let h = topFolders().map(f => node(f, false)).join('');
  const un = list.filter(tp => !tp.folder || !valid.has(tp.folder));
  if (un.length) h += `<details class="folder" ${OPEN.f_none ?? true ? 'open' : ''} ontoggle="OPEN['f_none']=this.open"><summary style="--fc:#475569"><span class="fname">🗂 未分類</span><span class="fcount">${un.length}</span></summary><div class="fbody"><div class="btns" style="margin-top:0"><button onclick="classifyStart('api')">🤖 AI 建議分類（API）</button><button onclick="classifyStart('semi')">📋 半自動分類（貼到 Claude）</button></div>${un.map(tp => topicItem(tp)).join('')}</div></details>`;
  return h;
}
function renderTopics() {
  const q = Q.text.trim().toLowerCase();
  let list = [...TOPICS.values()].sort((a, b) => b.updatedAt - a.updatedAt);
  if (Q.exec === 'semi' || Q.exec === 'auto') list = list.filter(tp => tp.exec === Q.exec);
  if (Q.exec === 'imported') list = list.filter(tp => tp.archive);
  if (Q.exec === 'open') list = list.filter(tp => { const l = tp.turns[tp.turns.length - 1]; return !l || !DONE_ST.includes(l.status); });
  if (Q.tag) list = list.filter(tp => tagsOf(tp).includes(Q.tag));
  const hitsOf = new Map();
  if (q) list = list.filter(tp => { const h = topicHits(tp, q); if (h.length) hitsOf.set(tp.id, h); return h.length; });
  const filt = [['all', '全部'], ['semi', '半自動'], ['auto', '自動'], ['open', '未完成']].concat([...TOPICS.values()].some(t => t.archive) ? [['imported', '匯入的']] : []);
  let h = `${syncBar()}<div class="btns" style="margin-top:0"><button class="primary" onclick="NT.folder='';go('new')">＋ 新主題</button><button class="primary" style="background:#1d4ed8;border-color:#1d4ed8" onclick="go('route')">📨 這份資料該放哪？</button></div>
    <section class="card"><input id="qText" type="search" value="${esc(Q.text)}" placeholder="🔍 搜尋主題、問題、資料、最終版…" oninput="Q.text=this.value;renderTopics()">
    <div class="chips" style="margin-top:8px">${filt.map(([k, n]) => `<button class="chip ${Q.exec === k ? 'on' : ''}" onclick="Q.exec='${k}';renderTopics()">${n}</button>`).join('')}</div>
    ${allTags().length ? `<div class="chips" style="margin-top:8px">${allTags().map(([t, n]) => `<span class="tag ${Q.tag === t ? 'on' : ''}" onclick="Q.tag=Q.tag==='${esc(t)}'?'':'${esc(t)}';renderTopics()">#${esc(t)} <small>${n}</small></span>`).join('')}</div>` : ''}
    ${q || Q.exec !== 'all' || Q.tag ? `<div class="hint">找到 ${list.length} 個主題${Q.tag ? `（標籤 #${esc(Q.tag)}，<a href="#" onclick="Q.tag='';renderTopics();return false">清除</a>）` : ''}</div>` : ''}</section>`;
  const stars = list.filter(tp => tp.star);
  if (!q && !Q.tag && stars.length) h += `<details class="folder" ${OPEN.f_star ?? true ? 'open' : ''} ontoggle="OPEN['f_star']=this.open"><summary style="--fc:#ca8a04"><span class="fname">⭐ 收藏</span><span class="fcount">${stars.length}</span></summary><div class="fbody">${stars.map(tp => topicItem(tp)).join('')}</div></details>`;
  if (q || Q.tag) h += list.length ? list.map(tp => topicItem(tp, q, hitsOf.get(tp.id))).join('') : '<div class="empty">沒有符合的主題。</div>';
  else if (!TOPICS.size) h += '<div class="empty">還沒有主題。按「＋ 新主題」開始。</div>' + folderTree(list);
  else h += folderTree(list);
  setMain(h);
}

/* ---------- 步驟卡片 ---------- */
function stepTitle(s, st) {
  const n = st.provider ? N(st.provider) : '';
  switch (st.type) {
    case 'draft': return `第 1 版 · ${n} 主寫`;
    case 'revise': return `第 ${drafts(s).indexOf(st) + 1} 版（依審查修正）· ${n}`;
    case 'review': return `第 ${st.round || '?'} 輪審查 · ${n}`;
    case 'arbitrate': return `第三方複審裁定 · ${n}`;
    case 'answer': return `① ${n} 各自分析`;
    case 'refine': { const k = s.steps.filter(x => x.type === 'refine' && x.provider === st.provider && x.status === 'ok').indexOf(st) + 1; return `② ${n} 審查＋修正版${k > 1 ? `（第 ${k} 輪）` : ''}`; }
    case 'integrate': { const k = s.steps.filter(x => x.type === 'integrate' && x.status === 'ok').indexOf(st) + 1; return `③ 驗證報告 · ${n}${k > 1 ? `（第 ${k} 輪）` : ''}`; }
    case 'cross': return `${n} 的互審意見`;
    case 'judge': return `裁判總結 · ${n}`;
    case 'imgprompt': return `生圖提示詞 · ${st.template ? '範本' : n}`;
    case 'imgcheck': return `圖檔校對第 ${st.num || '?'} 張 · ${n}`;
    case 'note': return '📎 你的補充／指示';
    case 'force': return '🔁 你要求再審一輪';
    default: return '系統';
  }
}
function stepMeta(st) {
  if (!st.provider || st.status !== 'ok' || st.template) return '';
  if (st.manual) return `<div class="meta">網頁版（手動貼回）</div>`;
  return `<div class="meta">${esc(st.model || '')}　輸入 ${st.tin} / 輸出 ${st.tout} tokens　${money(st.cost)}　${(st.ms / 1000).toFixed(0)} 秒</div>`;
}
function reviewBody(s, st, isLast) {
  let h = '';
  if (st.data) {
    h += `<p><b>總評：</b>${esc(st.data.summary || '')}</p>`;
    const is = st.data.issues || [];
    if (is.length) h += '<ul class="issues">' + is.map(i => `<li>${badge(i.severity === 'major' ? '重大' : '次要', i.severity === 'major' ? '#b91c1c' : '#475569')} <b>#${esc(i.id)}</b> ${esc(i.problem)}${i.suggestion ? `<br><span class="meta">建議：${esc(i.suggestion)}</span>` : ''}</li>`).join('') + '</ul>';
    const ev = st.data.evidence_needed || [];
    if (ev.length) h += `<div class="warn"><b>需要你補充：</b><ul class="issues">${ev.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
    if ((st.data.disputed_ids || []).length) h += `<p class="meta">堅持的爭議意見：#${st.data.disputed_ids.map(esc).join('、#')}</p>`;
  } else h += `<div class="warn">審查結果格式無法解析，以下是原文。請你直接改判。</div><div class="md">${md(st.text)}</div>`;
  if (st.originalVerdict) h += `<p class="meta">原判定：${VERD[st.originalVerdict]?.[0] || st.originalVerdict}，已由你改判</p>`;
  if (isLast && !RUNNING.has(s.id)) h += `<div class="btns"><button onclick="override('${s.id}','${st.id}','PASS')">✅ 改判通過</button><button onclick="override('${s.id}','${st.id}','REVISE')">✏️ 改判需修改</button></div>`;
  return h;
}
function stepCard(s, st, opts = {}) {
  const color = st.provider ? P[st.provider].color : '#475569';
  let title = stepTitle(s, st), extra = '', body = '';
  if (st.status === 'error') { title = '❌ ' + title + ' 失敗'; body = `<div class="warn">${esc(st.error)}</div><p class="meta">按「續跑」會從這一步重新執行。</p>`; }
  else if (st.type === 'review') { extra = badge(VERD[st.verdict]?.[0] || st.verdict, VERD[st.verdict]?.[1] || '#475569'); body = reviewBody(s, st, opts.isLastReview); }
  else if (st.type === 'revise') {
    const rs = st.data?.responses || [];
    if (rs.length) body += '<p><b>對審查意見的回應：</b></p><ul class="issues">' + rs.map(r => `<li>${badge(r.decision === 'reject' ? '不接受' : '接受', r.decision === 'reject' ? '#7c3aed' : '#0a7d4f')} <b>#${esc(r.id)}</b> ${esc(r.reason)}</li>`).join('') + '</ul>';
    body += `<details class="plain" ${opts.isLatestDraft ? 'open' : ''}><summary>📄 修正後全文</summary><div class="md">${md(st.revised)}</div></details>`;
  }
  else if (st.type === 'arbitrate') {
    if (st.data) body = `<p>${esc(st.data.summary || '')}</p><ul class="issues">` + (st.data.rulings || []).map(r => `<li>${badge(r.winner === 'reviewer' ? '審查者有理' : '主寫者有理', r.winner === 'reviewer' ? '#b45309' : '#0a7d4f')} <b>#${esc(r.id)}</b> ${esc(r.reason)}</li>`).join('') + '</ul>';
    else body = `<div class="warn">複審結果無法解析，原文如下。</div><div class="md">${md(st.text)}</div>`;
  }
  else if (st.type === 'note') body = `<p>${esc(st.text).replace(/\n/g, '<br>')}</p>`;
  else if (st.type === 'force') body = '<p>已追加一輪審查。</p>';
  else body = `<div class="md">${md(st.text)}</div>`;
  const canRerun = ['draft', 'review', 'revise', 'arbitrate', 'answer', 'refine', 'cross', 'judge', 'integrate'].includes(st.type) && !RUNNING.has(s.id) && !AUX.has(s.id);
  if (st.status === 'ok' && (['draft', 'revise', 'answer', 'refine', 'judge', 'integrate'].includes(st.type) || canRerun)) body += `<div class="btns">${['draft', 'revise', 'answer', 'refine', 'judge', 'integrate'].includes(st.type) ? `<button onclick="pickFinal('${s.id}','${st.id}')">${s.finalStepId === st.id ? '⭐ 目前的最終版' : '☆ 選為最終版'}</button>` : ''}${canRerun ? `<button onclick="rerunStep('${s.id}','${st.id}')">🔄 重跑這一步</button>` : ''}</div>`;
  const open = OPEN[st.id] ?? !!opts.defOpen;
  return `<details class="step" style="--c:${color}" ${open ? 'open' : ''} ontoggle="OPEN['${st.id}']=this.open"><summary>${esc(title)} ${extra}</summary><div class="body">${stepMeta(st)}${body}</div></details>`;
}

/* ---------- 半自動：待貼上卡片 ---------- */

          <li>把對話<b>重新命名</b>為「${esc(tp.title)}」 <button class="mini" onclick="copyText(TOPICS.get('${tp.id}').title,'已複製主題名稱')">📋 複製名稱</button></li>
          <li>把這個對話的<b>網址</b>貼在下面，之後就能一鍵開啟</li></ol>

        : url ? '' : `<div class="hint" style="margin-top:0">在「⚙️ 主題設定與背景」填上 ${N(it.provider)} 的對話網址，就能一鍵開啟。</div>`}
        <details class="plain"><summary>查看要貼的內容</summary><div class="copybox">${esc(it.msg)}</div></details>
        <textarea id="paste_${it.id}" rows="4" placeholder="把 ${N(it.provider)} 的回覆貼在這裡" oninput="PASTE_DRAFT['${it.id}']=this.value">${esc(PASTE_DRAFT[it.id] || '')}</textarea>
        <div class="btns"><button class="primary" onclick="submitPaste('${s.id}','${it.id}')">✔ 送出 ${N(it.provider)} 的回覆</button></div></div>`;
    }).join('') + `<div class="btns"><button onclick="cancelPending('${s.id}')">⏸ 先暫停（之後按續跑會重新產生）</button></div></div>`;
}
async function copyMsg(tid, pid) {
  const s = T(tid), it = s.pending.find(x => x.id === pid); if (!it) return;

/* ---------- 每一問 ---------- */
function finalCard(s) {
  if (!s.final) return '';
  const bad = s.status === 'unverified' || s.status === 'disputed';
  const src = s.steps.find(x => x.id === s.finalStepId);
  let h = `<section class="card final ${bad ? 'bad' : ''}"><h3>${bad ? '⚠️ 目前版本（尚未通過驗證）' : s.report ? '✅ 驗證結果' : '⭐ 最終版本'}${s.finalManual ? '（你選定）' : ''}</h3>`;
  if (src && src.provider) h += `<div class="meta">來源：${esc(stepTitle(s, src))}</div>`;
  if (s.status === 'unverified') {
    const rv = lastOk(s, 'review');
    const majors = (rv?.data?.issues || []).filter(i => i.severity === 'major');
    h += `<div class="warn">已達 ${s.config.rounds} 輪上限，仍有未解決的問題，不能視為驗證通過。${majors.length ? '<ul class="issues">' + majors.map(i => `<li><b>#${esc(i.id)}</b> ${esc(i.problem)}</li>`).join('') + '</ul>' : ''}可以「多跑一輪」，或補充資料後再審。</div>`;
  }
  if (s.report) h += `<details class="plain report" ${OPEN['rep_' + s.id] ?? true ? 'open' : ''} ontoggle="OPEN['rep_${s.id}']=this.open"><summary>📋 驗證報告（共識・分歧・已修正錯誤・未確認事項）</summary><div class="md">${md(s.report)}</div>
    <div class="btns"><button onclick="copyText(T('${s.id}').report,'已複製驗證報告')">📋 複製驗證報告</button></div></details><h3 style="margin-top:12px">⭐ 最終版</h3>`;
  h += `<div class="md">${md(s.final)}</div><div class="btns"><button class="primary" onclick="copyText(T('${s.id}').final,'已複製最終版')">📋 複製最終版</button></div></section>`;
  return h;
}
function imgSection(s) {
  if (!s.final) return '';
  const tp = topicOf(s);
  const busy = RUNNING.has(s.id) || AUX.has(s.id);
  const ip = imgPrompt(s);
  const gptUrl = tp.urls.openai;
  const copyOpenGpt = (expr, msg) => `copyText(${expr},'${msg}');openChat('openai',topicOf(T('${s.id}')).urls.openai)`;
  const pg = s.imgPages || 1;
  let h = `<section class="card"><h3>🖼 一頁圖檔</h3><div class="lbl">① 生圖提示詞（貼到 ChatGPT）</div>
    <div class="chips" style="margin-bottom:6px"><span class="meta" style="align-self:center">頁數：</span>${[1, 2].map(n => `<button class="chip ${pg === n ? 'on' : ''}" onclick="T('${s.id}').imgPages=${n};save(T('${s.id}'));refresh()">${n} 頁</button>`).join('')}<span class="hint" style="align-self:center;margin:0">直式・手機閱讀・結論先行${pg === 2 ? '・資料多時分兩頁' : ''}</span></div>`;
  if (ip) h += `<div class="copybox">${esc(ip.text)}</div><div class="btns"><button class="primary" onclick="${copyOpenGpt(`lastOk(T('${s.id}'),'imgprompt').text`, '已複製，到 ChatGPT 貼上')}">📋 複製${gptUrl ? '並開啟 ChatGPT' : '提示詞'}</button><button ${busy ? 'disabled' : ''} onclick="genImgPrompt('${s.id}')">🔄 重新產生</button></div>`;
  else h += `<div class="btns"><button class="primary" ${busy ? 'disabled' : ''} onclick="genImgPrompt('${s.id}')">🎨 產生生圖提示詞</button></div><div class="hint">${s.exec === 'semi' ? '用固定範本把最終版包成生圖指令（不需呼叫 AI）。' : `由 ${N(S.imgAI)} 根據最終版，逐字列出圖上要出現的文字與數字。`}</div>`;
  const ipErr = s.steps.filter(x => x.type === 'imgprompt' && x.status === 'error').pop();
  if (ipErr && !ip) h += `<div class="warn">${esc(ipErr.error)}</div>`;
  h += `<div class="lbl">② 圖檔校對（${N(S.imgAI)} 對照原始資料與最終版，逐項比對）</div>`;

function multiProcess(s) {

  const per = p => ok.filter(x => x.provider === p && ['answer', 'refine', 'cross'].includes(x.type));
  const finalSteps = ok.filter(x => ['integrate', 'judge', 'sys'].includes(x.type));
  const latestOf = p => { const l = per(p).filter(x => x.status === 'ok'); return l[l.length - 1]; };
  const tabs = PROVS.map(p => [p, N(p)]);
  if (finalSteps.length) tabs.push(['final', s.mode === 'mutual' ? '③ 整合過程' : '⚖️ 裁判']);
  let tab = TAB[s.id]; if (!tab || !tabs.some(x => x[0] === tab)) tab = tabs[0][0];
  const list = tab === 'final' ? finalSteps : per(tab);
  let h = `<div class="mob"><div class="tabs">${tabs.map(([k, n]) => `<button class="${tab === k ? 'on' : ''}" onclick="TAB['${s.id}']='${k}';refresh()">${n}</button>`).join('')}</div>`;
  h += list.map(st => stepCard(s, st, { defOpen: tab === 'final' || st === latestOf(tab) || st.status === 'error' })).join('') || '<div class="empty">尚未產生</div>';
  h += '</div>';
  const hasRefine = ok.some(x => x.type === 'refine');
  const views = [['all', '全部步驟'], ['answer', '① 原始分析']].concat(hasRefine ? [['refine', '② 修正版'], ['notes', '審查與修改說明']] : []);
  let vw = TAB['v_' + s.id] || 'all'; if (!views.some(x => x[0] === vw)) vw = 'all';
  const colBody = p => {
    if (vw === 'all') return per(p).map(st => stepCard(s, st, { defOpen: st === latestOf(p) || st.status === 'error' })).join('');
    if (vw === 'answer') return per(p).filter(x => x.type === 'answer').map(st => stepCard(s, st, { defOpen: true })).join('');
    const r = lastOf(s, 'refine', p); if (!r) return '';
    if (vw === 'refine') { const sec = mdSection(r.text, /修正後的完整分析/); return `<div class="card md">${md(sec || r.text)}</div>`; }
    return `<div class="card md">${md([mdSection(r.text, /審查/), mdSection(r.text, /修改說明/)].filter(Boolean).map((x, i) => (i ? '### 修改說明\n' : '### 對另外兩家的審查\n') + x).join('\n\n') || r.text)}</div>`;
  };
  h += `<div class="cols" style="grid-template-columns:1fr"><div class="tabs" style="margin:0">${views.map(([k, n]) => `<button class="${vw === k ? 'on' : ''}" onclick="TAB['v_${s.id}']='${k}';refresh()">${n}</button>`).join('')}</div></div>`;
  h += `<div class="cols">${PROVS.map(p => `<div class="col"><h4 style="color:${P[p].color}">${N(p)}</h4>${colBody(p) || '<div class="empty">尚未產生</div>'}</div>`).join('')}</div>`;
  h += `<div class="cols" style="grid-template-columns:1fr">${finalSteps.map(st => stepCard(s, st, {})).join('')}</div>`;
  return h;
}
function relayProcess(s) {
  const reviews = s.steps.filter(x => x.status === 'ok' && x.type === 'review');
  const lastRev = reviews[reviews.length - 1];

  const latest = curDraft(s);
  return s.steps.filter(x => x.type !== 'imgprompt' && x.type !== 'imgcheck').map(st => stepCard(s, st, {
    isLastReview: st === lastRev && lastMeaning === lastRev,
    isLatestDraft: st === latest && !s.final,
    defOpen: st === lastRev || st.status === 'error' || st.type === 'note' || (st === latest && !s.final)

}

function compress(file, M = 2000, q = 0.9) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height;
      if (Math.max(w, h) > M) { const r = M / Math.max(w, h); w = Math.round(w * r); h = Math.round(h * r); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('圖片讀取失敗')); };
    img.src = url;
  });
}
async function addImgs(files) { for (const f of files) { try { C.images.push(await compress(f)); } catch (e) { toast(e.message); } } refresh(); }
function pasteImg(e) {
  const items = [...(e.clipboardData?.items || [])].filter(it => it.type.startsWith('image/'));
  if (!items.length) return;
  e.preventDefault(); e.stopPropagation();
  Promise.all(items.map(it => compress(it.getAsFile()))).then(us => { C.images.push(...us); refresh(); });
}

/* 重跑某一步：只移除這一步與「依賴它」的後續步驟，其他已完成的保留 */
function rerunPlan(s, st) {
  const ok = x => !AUX_TYPES.includes(x.type) && x.type !== 'note';
  const idx = s.steps.indexOf(st);
  if (s.mode === 'relay') return s.steps.filter((x, i) => i >= idx && ok(x) && x.type !== 'force');
  const roundOf = x => s.steps.filter(y => y.type === x.type && y.provider === x.provider && y.status === 'ok').indexOf(x) + 1;
  const intRound = x => s.steps.filter(y => y.type === 'integrate' && y.status === 'ok').indexOf(x) + 1;
  const all = s.steps.filter(x => ok(x) && x.status === 'ok');
  switch (st.type) {
    case 'answer': return [st, ...all.filter(x => ['refine', 'integrate', 'cross', 'judge'].includes(x.type))];
    case 'refine': { const k = roundOf(st); return [st, ...all.filter(x => (x.type === 'refine' && roundOf(x) > k) || (x.type === 'integrate' && intRound(x) >= k))]; }
    case 'integrate': { const k = intRound(st); return [st, ...all.filter(x => (x.type === 'integrate' && intRound(x) > k) || (x.type === 'refine' && roundOf(x) > k))]; }
    case 'cross': return [st, ...all.filter(x => x.type === 'judge')];
    default: return [st];
  }
}
async function rerunStep(tid, sid) {
  const s = T(tid), st = s.steps.find(x => x.id === sid); if (!st) return;
  const plan = [...new Set(rerunPlan(s, st))];
  const more = plan.length - 1;
  if (!confirm(`重跑「${stepTitle(s, st)}」？${more ? `\n後面依賴它的 ${more} 個步驟也會一起重新產生。` : ''}\n其他已完成的步驟會保留。`)) return;
  const kill = new Set(plan.map(x => x.id));
  s.steps = s.steps.filter(x => !kill.has(x.id) || x.type === 'force');
  s.final = null; s.report = ''; s.finalStepId = null; s.finalManual = false;
  await save(s); run(s);
}

  if (st.type === 'force') return '要求再審一輪';

}

async function zipEntry(file, match) {

      const data = buf.subarray(start, start + csize);
      if (method === 0) return td.decode(data);
      if (method === 8) return td.decode(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      throw new Error('不支援的壓縮方式');

}

let SEEN = JSON.parse(localStorage.getItem('aic_sync_seen') || '{}');   /* 每個主題上次同步時雲端的版本 */
let TOMB = JSON.parse(localStorage.getItem('aic_sync_del') || '{}');    /* 本機刪除、尚未通知雲端的主題 */
const saveSeen = () => localStorage.setItem('aic_sync_seen', JSON.stringify(SEEN));
const saveTomb = () => localStorage.setItem('aic_sync_del', JSON.stringify(TOMB));
const SY = { busy: false, timer: null };
const syncOn = () => !!(S.sync && S.sync.url && S.sync.token);
const saveSyncCfg = () => localStorage.setItem('aic_settings', JSON.stringify(S));
async function gas(action, body) {
  let r;
  try { r = await fetch(S.sync.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: S.sync.token, action, ...body }) }); }
  catch (e) { throw new Error('連不上同步網址（網路中斷，或網址不正確）'); }
  if (!r.ok) throw new Error('同步伺服器錯誤 ' + r.status);
  let j; try { j = await r.json(); } catch (e) { throw new Error('同步網址不正確（請確認是 /exec 結尾的網頁應用程式網址，存取權設為「所有人」）'); }
  if (!j.ok) throw new Error(j.error || '同步失敗');
  return j;
}
function scheduleSync(ms) { if (!syncOn() || !S.sync.auto) return; clearTimeout(SY.timer); SY.timer = setTimeout(() => syncNow(true), ms ?? 30000); }
const topicBusy = tp => AUX.has(tp.id) || tp.turns.some(t => RUNNING.has(t.id) || AUX.has(t.id));
async function applyRemote(tp) {
  const old = TOPICS.get(tp.id);
  if (old) for (const t of old.turns) { TURNS.delete(t.id); TOPIC_OF.delete(t.id); }
  for (const t of tp.turns) { if (t.status === 'running') t.status = 'paused'; t.pending = []; }
  tp.sent = tp.sent || {}; tp.auxSteps = tp.auxSteps || [];
  reg(tp); await DB.put(serialTopic(tp));
}
async function syncNow(silent) {
  if (!syncOn()) { if (!silent) toast('請先填好同步網址與密碼'); return; }
  if (SY.busy) return;
  SY.busy = true; refreshSync();
  let up = 0, down = 0, del = 0;
  try {
    const idx = await gas('index', {});
    /* 設定與資料夾：較新的一方為準 */
    const la = S.setAt || 0, ra = idx.settingsAt || 0;
    if (idx.settings && ra > la) {
      for (const k of SYNC_SUB_KEYS) if (idx.settings[k] !== undefined) S[k] = idx.settings[k];
      S.setAt = ra; S._lastSub = JSON.stringify(syncSub()); saveSyncCfg();
    } else if (la > ra) await gas('settings', { settings: syncSub(), at: la });
    /* 本機刪除的主題 */
    for (const [id, at] of Object.entries(TOMB)) { await gas('del', { id, at }); delete TOMB[id]; saveTomb(); del++; }
    const remote = idx.topics || {}, toGet = [];
    for (const [id, r] of Object.entries(remote)) {
      const lc = TOPICS.get(id);
      if (r.d) {
        if (lc && !topicBusy(lc) && lc.updatedAt <= r.u) {
          await DB.del(id); for (const t of lc.turns) { TURNS.delete(t.id); TOPIC_OF.delete(t.id); }
          TOPICS.delete(id); delete SEEN[id]; del++;
        }
        continue;
      }
      if (!lc) { toGet.push(id); continue; }
      if (topicBusy(lc)) continue;
      if (r.u > lc.updatedAt) {
        if (lc.updatedAt > (SEEN[id] || 0)) await gas('conflict', { topic: serialTopic(lc) });  /* 兩邊都改過：本機版本先存到衝突備份 */
        toGet.push(id);
      }
    }
    for (let i = 0; i < toGet.length; i += 4) {
      const j = await gas('get', { ids: toGet.slice(i, i + 4) });
      for (const tp of j.topics) { await applyRemote(tp); SEEN[tp.id] = tp.updatedAt; down++; }
      saveSeen();
    }
    for (const tp of [...TOPICS.values()]) {
      if (topicBusy(tp)) continue;
      const r = remote[tp.id];
      if (r && !r.d && r.u >= tp.updatedAt) { SEEN[tp.id] = r.u; continue; }
      if (r && r.d && tp.updatedAt <= r.u) continue;
      await gas('put', { topic: serialTopic(tp), prevU: SEEN[tp.id] ?? null });
      SEEN[tp.id] = tp.updatedAt; up++; saveSeen();
    }
    saveSeen();
    S.sync.last = Date.now(); S.sync.err = ''; saveSyncCfg();
    if (!silent || up || down || del) toast(`☁️ 同步完成：上傳 ${up}、下載 ${down}${del ? `、刪除 ${del}` : ''}`);
  } catch (e) {
    S.sync.err = String(e.message || e); saveSyncCfg();
    if (!silent) toast('同步失敗：' + S.sync.err);
  } finally { SY.busy = false; refresh(); }
}

}

}

<script type="text/plain" id="gasCode">// AI Council 同步中繼程式 v1.0
// 部署：網頁應用程式／執行身分：我／存取權：所有人
// 專案設定 → 指令碼屬性 → 新增 TOKEN = 你的同步密碼
var FOLDER_NAME = 'AI Council 同步';

function doPost(e) {
  var req;
  try { req = JSON.parse(e.postData.contents); } catch (err) { return out_({ ok: false, error: '資料格式錯誤' }); }
  var token = PropertiesService.getScriptProperties().getProperty('TOKEN');
  if (!token) return out_({ ok: false, error: 'GAS 尚未設定 TOKEN（同步密碼）' });
  if (req.token !== token) return out_({ ok: false, error: '同步密碼錯誤' });
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var root = folder_(), tf = sub_(root, 'topics');
    var idx = readJson_(root, 'index.json') || { topics: {}, settings: null, settingsAt: 0 };
    switch (req.action) {
      case 'ping':
        return out_({ ok: true, count: Object.keys(idx.topics).filter(function (k) { return !idx.topics[k].d; }).length });
      case 'index':
        return out_({ ok: true, topics: idx.topics, settings: idx.settings || null, settingsAt: idx.settingsAt || 0 });
      case 'get':
        return out_({ ok: true, topics: (req.ids || []).map(function (id) { return readJson_(tf, id + '.json'); }).filter(function (x) { return x; }) });
      case 'put': {
        var tp = req.topic, cur = idx.topics[tp.id];
        if (cur && !cur.d && req.prevU != null && cur.u > req.prevU && cur.u !== tp.updatedAt) {
          var old = readJson_(tf, tp.id + '.json');
          if (old) writeJson_(sub_(root, '衝突備份'), tp.id + '_cloud_' + cur.u + '.json', old);
        }
        writeJson_(tf, tp.id + '.json', tp);
        idx.topics[tp.id] = { u: tp.updatedAt, t: tp.title };
        writeJson_(root, 'index.json', idx);
        return out_({ ok: true });
      }
      case 'conflict':
        writeJson_(sub_(root, '衝突備份'), req.topic.id + '_device_' + Date.now() + '.json', req.topic);
        return out_({ ok: true });
      case 'del': {
        live_(tf, req.id + '.json').forEach(function (x) { x.setTrashed(true); });
        idx.topics[req.id] = { u: req.at, d: 1 };
        writeJson_(root, 'index.json', idx);
        return out_({ ok: true });
      }
      case 'settings':
        idx.settings = req.settings; idx.settingsAt = req.at;
        writeJson_(root, 'index.json', idx);
        return out_({ ok: true });
    }
    return out_({ ok: false, error: '未知的動作' });
  } finally {
    lock.releaseLock();
  }
}

function doGet() { return out_({ ok: true, app: 'AI Council 同步' }); }

function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
function folder_() { var it = DriveApp.getFoldersByName(FOLDER_NAME); return it.hasNext() ? it.next() : DriveApp.createFolder(FOLDER_NAME); }
function sub_(p, n) { var it = p.getFoldersByName(n); return it.hasNext() ? it.next() : p.createFolder(n); }
function live_(f, name) {
  var it = f.getFilesByName(name), arr = [];
  while (it.hasNext()) { var x = it.next(); if (!x.isTrashed()) arr.push(x); }
  arr.sort(function (a, b) { return b.getLastUpdated() - a.getLastUpdated(); });
  return arr;
}
function readJson_(f, name) {
  var arr = live_(f, name);
  if (!arr.length) return null;
  try { return JSON.parse(arr[0].getBlob().getDataAsString('UTF-8')); } catch (e) { return null; }
}
function writeJson_(f, name, obj) {
  var blob = Utilities.newBlob(JSON.stringify(obj), 'application/json', name);
  var old = live_(f, name);
  f.createFile(blob);
  old.forEach(function (x) { x.setTrashed(true); });
}

// 第一次部署前可以先執行這個函式，完成 Google Drive 授權並建立資料夾
function setup() { folder_(); }
</script>
